# 每次推送或 Pull Request：在 Windows 與 Linux、Python 3.11–3.13 跑全部測試與 pyflakes
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pyflakes
        run: |
          python -m pip install --upgrade pip pyflakes
          python -m pyflakes dtm tests tools
      - name: 單元測試與系統測試
        run: python -m unittest discover -s tests -v
