# ---------------------------------------------------------------- 欄位說明
# [[pack]]
#   id          唯一代碼
#   title       顯示名稱
#   comp        元件：grease｜reducer｜gearbox｜motor（對應維護決策的三個建議）
#   axes        適用軸，例如 [3]；空陣列 = 全部軸
#   crew        人數；roles 列出分工（role、n、duty）
#   hours_min／hours_max  停機工時範圍（小時）；steps 每步的 hours 加總會另外顯示
#   sop_url     SOP 文件位置（內網或文件系統的網址）
#   toolsets    引用上方的工具組；tools 可另外列本作業專用工具
#   safety      作業安全指令（列印工單時每項有勾選欄）
#   steps       步驟：name、crew、hours
# [[pack.parts]]
#   name、pn（料號）、qty、unit、stock（庫存，選填）、verified（是否已依 Parts list 確認）、source（料號來源）、note
#   price（單價，選填）：保養材料費估算用；備品庫存（「保養與備品」頁）有同料號或同名稱的單價時，以庫存的單價為準
#   main = true：主件（減速機、馬達）；料號還沒確認時，用備品庫存裡同元件、同軸那一項的單價
#   grease = true 的品項會依設定檔 [axis.N] grease_mass_g 自動加註本軸給脂量與建議準備量（1.5 倍）
