# 備品與作業包目錄：R-2000iC/165F
#
# 維護決策發出建議（換脂、準備備品、安排更換、檢查馬達）時，系統依「軸 + 元件」找到對應的作業包，
# 在儀表板、LINE／Email 通知與列印工單中列出：備品料號與數量、潤滑脂、工具、人力、工時、安全事項、步驟。
#
# 重要：
# - 料號來自公開資料（FANUC 型錄、給脂資料、零件商標示），verified = false 表示「尚未以機台 Parts list 或銘牌確認」。
#   下單前請對照維護手冊 Appendix「Maintenance Parts」與機台銘牌，確認後改成 verified = true。
# - 工時是參考估算，不是原廠標準工時。請用實際作業紀錄修正。
# - stock 是目前庫存數量；小於 qty 時系統會標示「缺料」。不填 = 不檢查庫存。
# - 欄位說明在檔案最後。

[meta]
robot_model = "R-2000iC/165F"
manual = "R-2000iC 機構部維護手冊（B-83645EN）"
updated = "2026-10-14"
note = "料號來自公開資料，下單前請以機台 Parts list 與銘牌確認"

# ---------------------------------------------------------------- 工具組（各作業包共用）
[toolsets.hand]
name = "手工具"
items = [
  { name = "公制六角扳手組（含長柄）", qty = 1, unit = "組" },
  { name = "套筒扳手組（含延長桿、萬向接頭）", qty = 1, unit = "組" },
  { name = "扭力扳手：低扭力段", spec = "範圍依手冊螺栓扭力表", qty = 1, unit = "支" },
  { name = "扭力扳手：高扭力段", spec = "範圍依手冊螺栓扭力表", qty = 1, unit = "支" },
  { name = "頂絲（分離減速機用）", spec = "規格依頂出螺孔", qty = 2, unit = "支" },
  { name = "導桿（與固定螺栓同規格的長螺桿，對位用）", qty = 2, unit = "支" },
  { name = "塑膠槌、銅棒", qty = 1, unit = "組" },
  { name = "刮刀、油石（清除舊密封膠與毛邊）", qty = 1, unit = "組" },
]

[toolsets.lifting]
name = "吊掛與支撐"
items = [
  { name = "天車或移動式吊架", spec = "額定荷重 ≥ 被吊物重量 2 倍（重量依手冊）", qty = 1, unit = "台" },
  { name = "M10 環首螺栓", spec = "手冊指定的 J3 臂支撐方式", qty = 2, unit = "個" },
  { name = "吊帶", spec = "額定荷重符合吊掛計畫", qty = 2, unit = "條" },
  { name = "手拉吊車（微調對位）", qty = 1, unit = "台" },
  { name = "支撐架或枕木", qty = 1, unit = "組" },
]

[toolsets.grease]
name = "給脂與取樣"
items = [
  { name = "手動黃油槍（附壓力錶）", spec = "手冊要求用手動泵", qty = 1, unit = "支" },
  { name = "給脂嘴轉接頭", qty = 1, unit = "組" },
  { name = "廢脂收集袋或容器", qty = 2, unit = "個" },
  { name = "電子秤（量注入與排出量）", qty = 1, unit = "台" },
  { name = "鐵粉取樣瓶（舊脂中段、24 小時後殘留）", qty = 2, unit = "個" },
]

[toolsets.check]
name = "檢查與校正"
items = [
  { name = "示教器", qty = 1, unit = "台" },
  { name = "USB 隨身碟（控制器備份）", qty = 1, unit = "個" },
  { name = "萬用電表", qty = 1, unit = "台" },
  { name = "手電筒、檢查鏡", qty = 1, unit = "組" },
  { name = "標記筆、線材標籤（拆線前標記）", qty = 1, unit = "組" },
  { name = "零點校正用具", spec = "依廠內採用的校正方式", qty = 1, unit = "組" },
]

[toolsets.ppe]
name = "防護與上鎖"
items = [
  { name = "安全帽、安全鞋", qty = 1, unit = "每人" },
  { name = "耐油手套、耐熱手套", qty = 1, unit = "每人" },
  { name = "護目鏡", qty = 1, unit = "每人" },
  { name = "上鎖掛牌組（個人鎖、標籤）", qty = 1, unit = "每人" },
  { name = "清潔溶劑、無塵布、吸油棉", qty = 1, unit = "批" },
]

# ---------------------------------------------------------------- J3 減速機更換
[[pack]]
id = "R2000iC165F-J3-reducer"
title = "J3 減速機更換"
comp = "reducer"
axes = [3]
crew = 3
hours_min = 10
hours_max = 16
hours_note = "參考估算，非原廠標準工時；第一次作業建議排兩個班次。密封膠若需固化時間另計。"
toolsets = ["hand", "lifting", "grease", "check", "ppe"]
roles = [
  { role = "作業負責人", n = 1, duty = "機器人維修技師：上鎖掛牌、拆裝馬達、零點校正、試運轉" },
  { role = "機械技師", n = 1, duty = "拆裝減速機、清潔接合面、螺栓扭力、給脂" },
  { role = "吊掛作業人員", n = 1, duty = "持吊掛相關證照：吊車操作與指揮、J3 臂支撐" },
]
safety = [
  "作業前召開工具箱會議：確認分工、吊掛計畫、緊急停止位置",
  "控制器斷電並上鎖掛牌；每位進入圍籬的人員掛上自己的鎖",
  "拆 J3 馬達或解除 J3 制動器前，先用 M10 環首螺栓 ×2 與吊帶把 J3 臂吊住並受力；未支撐時手臂會落下",
  "吊掛由持證人員指揮；吊物下方與移動路徑禁止站人；確認吊具額定荷重",
  "剛停機的馬達與減速機可能高溫：戴耐熱手套或等待冷卻",
  "打開排脂口時油脂可能突然噴出：先套收集袋；給脂只用手動泵與指定油脂",
  "需要送電點動（釋放殘壓、零點校正）時：人員退出圍籬或握持示教器使能開關，倍率 10% 以下",
  "溶劑與密封膠在通風處使用並戴手套；廢脂與沾油廢棄物依廠內規定處理",
  "高處作業使用合格工作平台，依規定繫安全帶",
  "完工前清點工具，確認沒有遺留在機構內；解除掛牌由掛鎖人本人執行",
]
steps = [
  { name = "移到手冊指定的拆卸姿態、斷電上鎖、工具箱會議（核對備品與備份控制器在停機前完成）", crew = 2, hours = 1.0 },
  { name = "支撐 J3 臂（環首螺栓＋吊帶受力）；排出舊脂，先丟棄前段、取中段作鐵粉樣本", crew = 3, hours = 1.0 },
  { name = "標記並拆下 J3 馬達線材，拆下 J3 馬達", crew = 2, hours = 0.5 },
  { name = "拆固定螺栓、吊離 J3 臂組放上支撐架，頂出舊減速機", crew = 3, hours = 2.0 },
  { name = "清潔接合面；檢查定位銷、螺孔、馬達側齒輪齒面", crew = 2, hours = 1.0 },
  { name = "安裝新減速機：O 形環、密封膠、對角分段鎖到規定扭力", crew = 2, hours = 2.0 },
  { name = "吊回 J3 臂並對位鎖固；裝回 J3 馬達並接線；確認制動器撐住後拆除吊具（送電前必須拆完）", crew = 3, hours = 1.5 },
  { name = "給脂（排脂口打開，注入到新脂流出）並釋放殘壓", crew = 2, hours = 1.0 },
  { name = "脈衝重置與 J3 零點校正；以既有程式點位確認", crew = 2, hours = 1.5 },
  { name = "試運轉、漏油與異音檢查；執行 DTM_DIAG 並登錄事件", crew = 2, hours = 1.0 },
]

