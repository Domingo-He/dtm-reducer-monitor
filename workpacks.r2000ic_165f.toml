# ---------------------------------------------------------------- E1 行走軸給脂（齒輪箱與齒條）
[[pack]]
id = "R2000iC165F-E1-grease"
title = "E1 行走軸給脂（齒輪箱、齒條與小齒輪）"
comp = "grease"
axes = [7]
crew = 2
hours_min = 1
hours_max = 2
hours_note = "參考估算；給脂週期與給脂量依行走軸廠商手冊（自動給脂器的話檢查殘量與出脂）"
toolsets = ["grease", "check", "ppe"]
roles = [
  { role = "作業負責人", n = 1, duty = "機器人維修技師：上鎖掛牌、行走軸低速往返" },
  { role = "給脂人員", n = 1, duty = "齒輪箱給脂、齒條清潔與塗脂、自動給脂器檢查" },
]
safety = [
  "給脂、清潔齒條時斷電上鎖並固定滑座",
  "需要往返運轉讓油脂分布時，人員退出行走範圍、倍率 10% 以下",
]
steps = [
  { name = "斷電上鎖、固定滑座，清除齒條舊脂與粉塵，目視檢查齒面", crew = 2, hours = 0.5 },
  { name = "齒輪箱依手冊給脂（排脂口打開）；齒條與小齒輪塗脂或補充自動給脂器", crew = 2, hours = 0.5 },
  { name = "低速全行程往返數次讓油脂分布；在 DTM 登錄換脂", crew = 2, hours = 0.5 },
]

