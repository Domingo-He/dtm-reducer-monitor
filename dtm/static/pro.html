<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>程式層級診斷</title>
<style>
:root{--ink:#1F2A33;--ink2:#4A5866;--line:#DCE1E5;--bg:#EEF1F3;--card:#FFFFFF;--amber:#A35F0E;--teal:#2F6F73;--warn:#C98A12;--red:#B5462F;--gray:#8A9AA6;--soft:#F6F7F8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;font-size:14px}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
header .sub{color:#AEB9C2;font-size:13px}
.clk{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px;color:#C9D3DB;white-space:nowrap}
.langw{position:relative;display:inline-flex;align-items:center;color:#C9D3DB}.langw .globe{position:absolute;left:8px;pointer-events:none}.langw select{font-size:12px;padding:2px 8px 2px 28px;background:#2E3B46;color:#fff;border-color:#4A5866;cursor:pointer}.langw select:hover{background:#3A4955}.langw[hidden]{display:none}
header .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header a{color:#F2C98B;text-decoration:none;font-size:13px;font-weight:700}
.hbtn{background:#2E3B46;color:#fff;border-color:#4A5866;font-size:12px;padding:2px 10px}.hbtn:hover{background:#3A4955}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:14px 16px;min-width:0;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card h3{font-size:14px;margin:14px 0 6px}
button,select,input,textarea{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;color:var(--ink)}
button{cursor:pointer}button:hover{background:var(--soft)}button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri{background:var(--amber);border-color:var(--amber);color:#fff}button.pri:hover{background:#8C510B}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:700;background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2);font-size:12px}
.sess{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.sess:hover{background:var(--soft)}.sess.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.sess .t{display:flex;gap:6px;align-items:center;justify-content:space-between}
.pill{border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.r-before{background:#FBEFD9;color:#7A4708}.r-after{background:#E3F1EE;color:#1E5356}.r-diag{background:#E7EBF5;color:#34407A}
.r-control_before,.r-control_after{background:#ECEFF1;color:#4A5866}
.st-open{background:#E3F1EE;color:#1E5356}.st-closed{background:#ECEFF1;color:#4A5866}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{border-radius:999px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:8px;padding:8px 10px}.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.warnbox{background:#FBF0D9;color:#7A5208;border:1px solid #EBCB8B;border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px}
.safe{background:#E7EBF5;color:#34407A;border:1px solid #C5CDEA;border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:13px;line-height:1.6}
.bar{display:inline-block;height:9px;background:var(--amber);border-radius:2px;vertical-align:middle}
.sg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.sg .h{display:flex;gap:8px;align-items:baseline}.sg .h b{font-size:14px}.sg .why{margin:6px 0;line-height:1.6}
code,.code{font-family:Consolas,"Courier New",monospace;font-size:12.5px}
.diff{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 8px;align-items:center;margin:6px 0}
.diff .a{background:#FBEFEC;border-radius:4px;padding:2px 6px}.diff .b{background:#E9F4EF;border-radius:4px;padding:2px 6px}
svg{display:block;width:100%}svg text{font-family:inherit}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.row2{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center}
.form input,.form select,.form textarea{width:100%}
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:50;overflow:auto}
.modal[hidden]{display:none}.mbox{background:var(--card);border-radius:10px;max-width:640px;width:100%;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mhd b{font-size:16px}
.prog{font-family:Consolas,"Courier New",monospace;font-size:12.5px}
.prog td{padding:3px 6px}.prog tr.mv td:first-child{font-weight:700}.prog tr.off td{color:var(--gray)}
.prog tr.sel td{background:#FBEFD9}
.lv0{color:var(--teal)}.lv1{color:var(--warn);font-weight:700}.lv2{color:var(--red);font-weight:700}
.detail{background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;line-height:1.7}
.empty{color:var(--ink2);padding:24px;text-align:center}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
/* 在 DTM 主畫面裡開啟（?embed=1）：深色、跟主畫面一致，不顯示自己的標題列與語言選單 */
html.emb{--ink:#E6EBEF;--ink2:#A3B1BD;--line:#26323C;--bg:#0E1419;--card:#151D24;--amber:#E8B04A;--teal:#5FB8AE;--warn:#E8B04A;--red:#FF6B4A;--gray:#8D9CA8;--soft:#1A232B;color-scheme:dark}
html.emb body{background:var(--bg);color:var(--ink)}
html.emb header,html.emb #authWarn,html.emb #tlsWarn{display:none!important}
html.emb main{padding:4px 2px 24px;max-width:none}
html.emb .card{border-radius:12px}
html.emb a{color:#7DBBEA}html.emb .links a{color:#7DBBEA}
html.emb button,html.emb select,html.emb input,html.emb textarea{background:#1A232B;color:var(--ink);border-color:#32404B}
html.emb button:hover{background:#22303B}
html.emb button.on{background:#5AA9E6;border-color:#5AA9E6;color:#06121C;font-weight:700}
html.emb button.pri{background:#5AA9E6;border-color:#5AA9E6;color:#06121C}html.emb button.pri:hover{background:#7DBBEA}
html.emb .pill.ok,html.emb .lv0,html.emb .st-open,html.emb .r-after{background:#173A39;color:#8FD3CA}
html.emb .pill.bad,html.emb .lv2{background:#4A1F17;color:#FF9A80}
html.emb .pill.diag,html.emb .lv1,html.emb .r-before{background:#3F3013;color:#F3C15A}
html.emb .lv-1,html.emb .st-closed,html.emb .r-control_before,html.emb .r-control_after{background:#26323C;color:#C5D0D8}
html.emb .r-diag,html.emb .safe{background:#1C2E40;color:#8CC4EE;border-color:#2B4A66}
html.emb .warnbox,html.emb .warnbar{background:#3F3013;color:#F3C15A;border-color:#5A4520}
html.emb .sysbar,html.emb #sysBar{background:#4A1F17!important;color:#FF9A80!important;border-color:#6A2A1F!important}
html.emb .diff .a{background:#3A1F1A}html.emb .diff .b{background:#173A2C}
html.emb .prog tr.sel td{background:#3F3013}
html.emb .short,html.emb .lv2{color:#FF8A6B}html.emb .unv{color:#E8B04A}html.emb .tdtxt{color:#8FD3CA}
html.emb .mbox{background:#151D24;border:1px solid #26323C;box-shadow:0 18px 40px rgba(0,0,0,.6)}
html.emb .modal{background:rgba(4,8,12,.6)}
html.emb th{background:#1A232B;color:#A3B1BD}
html.emb svg [fill="#4A5866"]{fill:#A3B1BD}html.emb svg [stroke="#4A5866"]{stroke:#8D9CA8}
html.emb svg [stroke="#EEF1F3"],html.emb svg [stroke="#E3E7EA"],html.emb svg [stroke="#E9EDF0"],html.emb svg [stroke="#DCE1E5"]{stroke:#26323C}
html.emb svg [fill="#E3E7EA"],html.emb svg [fill="#E9EDF0"],html.emb svg [fill="#EEF1F3"]{fill:#26323C}
html.emb svg [stroke="#AEB9C2"],html.emb svg [stroke="#C9CED3"]{stroke:#5D6C78}
html.emb svg [fill="#fff"],html.emb svg [fill="#FFFFFF"]{fill:#151D24}html.emb svg [stroke="#fff"],html.emb svg [stroke="#FFFFFF"]{stroke:#151D24}
html.emb svg [fill="#1F2A33"]{fill:#E6EBEF}html.emb svg [stroke="#1F2A33"]{stroke:#E6EBEF}
html.emb svg [fill="#FBEFD9"]{fill:#3F3013}
html.emb svg [stroke="#B5462F"]{stroke:#FF6B4A}html.emb svg [fill="#B5462F"]{fill:#FF8A6B}
html.emb svg [stroke="#C98A12"]{stroke:#E8B04A}html.emb svg [fill="#C98A12"]{fill:#F3C15A}
html.emb svg [stroke="#2F6F73"]{stroke:#5FB8AE}html.emb svg [fill="#2F6F73"]{fill:#5FB8AE}
html.emb svg [stroke="#A35F0E"]{stroke:#E8B04A}html.emb svg [fill="#A35F0E"]{fill:#E8B04A}
html.emb [style*="color:#B5462F"]{color:#FF8A6B!important}html.emb [style*="color:#7A4708"],html.emb [style*="color:#7A5208"]{color:#F3C15A!important}
html.emb [style*="background:#FBEFD9"]{background:#3F3013!important}
html.emb .kpi,html.emb .detail{background:#1A232B}html.emb .sess:hover{background:#1A232B}
</style>
<script>try { if (new URLSearchParams(location.search).get("embed") === "1" && window.parent !== window) document.documentElement.classList.add("emb"); } catch (e) {}</script>
</head>
<body>
<header>
  <h1>程式層級診斷</h1>
  <span class="sub" id="robotLbl"></span>
  <div class="right">
    <a href="/" id="backLink">回到監測畫面</a>
    <span class="clk" id="clk"></span>
    <label class="langw" id="langW" title="Language"><svg class="globe" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/><ellipse cx="8" cy="8" rx="2.7" ry="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6h12M2 10h12" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><select id="langSel" aria-label="Language"></select></label>
    <button id="shotBtn" class="hbtn" type="button" title="全頁截圖（存成 PNG）" aria-label="全頁截圖"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" style="vertical-align:-3px"><path d="M3.5 6.5h3l1.3-2h4.4l1.3 2h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button id="whoBtn" class="hbtn" type="button">登入</button>
  </div>
</header>
<main>
<div class="layout">
  <aside>
    <div class="card">
      <h2>診斷期 <span class="tools"><button id="newBtn" type="button">新診斷期</button></span></h2>
      <label class="muted"><input type="checkbox" id="allRobots"> 顯示所有機器人</label>
      <div id="sessList" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>使用方式</h2>
      <ol class="muted" style="padding-left:18px;line-height:1.7;margin:0">
        <li>新診斷期：上傳程式文字版（.LS），選類別（改前、改後、對照組）。</li>
        <li>下載加註版程式載入控制器（每個動作行前把行號寫進 <span id="regLbl">R[114]</span>），診斷結束後換回原程式。</li>
        <li>資料：控制器串流 <code>python -m dtm pro listen</code>，或 CSV 匯入 <code>python -m dtm pro import</code></li>
        <li>看結果：最傷減速機的動作行、角度集中、等待餘裕、修改建議。</li>
        <li>修改後開「改後」診斷期，與改前、對照組比較。</li>
      </ol>
    </div>
  </aside>
  <section>
    <div class="card" id="head"><div class="empty">尚無診斷期</div></div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="overview" class="on">總覽</button>
      <button type="button" data-tab="timeline">時間軸</button>
      <button type="button" data-tab="program">程式</button>
      <button type="button" data-tab="angle">角度</button>
      <button type="button" data-tab="slack">等待餘裕</button>
      <button type="button" data-tab="suggest">修改建議</button>
      <button type="button" data-tab="impacts">衝擊與停止</button>
      <button type="button" data-tab="sweep">全範圍掃描</button>
      <button type="button" data-tab="compare">改善驗證</button>
    </nav>
    <div id="body"></div>
  </section>
</div>
</main>

<div class="modal" id="newModal" hidden>
  <div class="mbox">
    <div class="mhd"><b>新診斷期</b><button type="button" id="newClose">關閉</button></div>
    <div class="form">
      <label>機器人</label><input id="nRobot">
      <label>類別</label><select id="nRole"></select>
      <label>名稱</label><input id="nLabel" placeholder="例如：改前（10 月）">
      <label>實驗群組</label><input id="nGroup" placeholder="改前、改後、對照組用同一個群組名稱">
      <label>資料來源</label><select id="nSource"><option value="listen">控制器串流</option><option value="csv">CSV 匯入</option></select>
      <label>程式（.LS）</label><input type="file" id="nFile" accept=".ls,.LS,.txt">
      <label>改了什麼</label><textarea id="nChange" rows="2" placeholder="改後診斷期：簡述修改內容（寫進改善驗證報告）"></textarea>
    </div>
    <div class="muted" id="nParse" style="margin-top:8px"></div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><span class="muted" id="nMsg"></span><button class="pri" type="button" id="nOk">建立</button></div>
  </div>
</div>
<div class="modal" id="loginModal" hidden>
  <div class="mbox" style="max-width:420px">
    <div class="mhd"><b>登入</b><button type="button" id="lgClose">關閉</button></div>
    <div class="form"><label>帳號</label><input id="lgUser"><label>密碼</label><input id="lgPw" type="password"></div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><span class="muted" id="lgMsg"></span><button class="pri" type="button" id="lgOk">登入</button></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let LANG = null, I18N = {}, LOCALE = "zh-TW", INFO = null, SESS = [], CUR = null, TAB = "overview", SUM = null, AXSEL = null, LINESEL = null;
const LOCALES = {"zh-TW": "zh-TW", "zh-CN": "zh-CN", "en": "en-US", "ja": "ja-JP", "ko": "ko-KR", "vi": "vi-VN"};
const T = (s, p) => {
  let t = (I18N && I18N[s]) || s;
  if (!p) return t;
  return t.replace(/\{(\w+)(!l)?(?::([^}]*))?\}/g, (m, k, low, f) => {
    if (!(k in p)) return m;
    let v = p[k];
    if (f && typeof v === "number") { const d = (f.match(/\.(\d+)f/) || [])[1]; v = d !== undefined ? v.toFixed(+d) : v; }
    v = String(v);
    return low ? v.charAt(0).toLowerCase() + v.slice(1) : v;
  });
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hasCJK = s => /[㐀-鿿]/.test(s);
const fmt = (v, d=1) => v === null || v === undefined || Number.isNaN(v) ? "—" : Number(v).toLocaleString(LOCALE, {maximumFractionDigits:d, minimumFractionDigits:d});
const pct = (v, d=0) => v === null || v === undefined ? "—" : fmt(v * 100, d) + "%";
const sci = v => v === null || v === undefined ? "—" : Math.abs(v) >= 0.01 || v === 0 ? fmt(v, 3) : Number(v).toExponential(2);
const tfmt = ts => { if (!ts) return "—"; const d = new Date(ts*1000), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const dfmt = ts => tfmt(ts).slice(0, 10);
let AUTH = {token: null, who: ""};
// 在 DTM 主畫面裡（同一個視窗）開啟：登入狀態、語言跟主畫面共用；經由主畫面轉送時路徑前面多 /r/<機器人>
const EMBED = (() => { try { return new URLSearchParams(location.search).get("embed") === "1" && window.parent !== window && !!window.parent.DTM_SHELL; } catch (e) { return false; } })();
const SHELL = EMBED ? window.parent.DTM_SHELL : null;
const BASE = (location.pathname.match(/^\/r\/[^/]+/) || [""])[0];
const U = p => typeof p === "string" && p.startsWith("/") && !p.startsWith("//") ? BASE + p : p;
const authToken = () => SHELL ? SHELL.token() : (AUTH && AUTH.token);
if (SHELL) ["mousedown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => SHELL.activity(), {passive: true}));
const withLang = u => { u = U(u); return LANG ? u + (u.includes("?") ? "&" : "?") + "lang=" + encodeURIComponent(LANG) : u; };
async function api(p, retry = true) {
  const tk = authToken();
  const r = await fetch(withLang(p), tk ? {headers: {"X-DTM-Token": tk}} : {});
  if (r.status === 401 && retry && SHELL) { await SHELL.login(); return api(p, false); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
try { AUTH = JSON.parse(sessionStorage.getItem("dtm_auth")) || AUTH; } catch (e) {}
function saveAuth() { try { sessionStorage.setItem("dtm_auth", JSON.stringify(AUTH)); } catch (e) {} renderWho(); }
function renderWho() { $("#whoBtn").textContent = AUTH.token ? T("操作人：{who}｜登出", {who: AUTH.who || "—"}) : T("登入"); }
let loginWait = null;
function askLogin() { if (SHELL) return SHELL.login(); $("#lgMsg").textContent = ""; $("#lgPw").value = ""; $("#lgUser").value = AUTH.who || ""; $("#loginModal").hidden = false;
  return new Promise((res, rej) => { loginWait = {res, rej}; }); }
async function post(p, body, retry = true) {
  const h = {"Content-Type": "application/json"}, tk = authToken(); if (tk) h["X-DTM-Token"] = tk;
  const r = await fetch(withLang(p), {method: "POST", headers: h, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && retry) { if (!SHELL) { AUTH.token = null; saveAuth(); } await askLogin(); return post(p, body, false); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
$("#lgOk").onclick = async () => {
  try { const j = await post("/api/login", {who: $("#lgUser").value, username: $("#lgUser").value, password: $("#lgPw").value}, false);
    AUTH = {token: j.token, who: j.who}; saveAuth(); $("#loginModal").hidden = true; if (loginWait) { loginWait.res(); loginWait = null; } }
  catch (e) { $("#lgMsg").textContent = e.message; }
};
$("#lgClose").onclick = () => { $("#loginModal").hidden = true; if (loginWait) { loginWait.rej(new Error(T("未登入"))); loginWait = null; } };
$("#whoBtn").onclick = async () => { if (AUTH.token) { try { await post("/api/logout", {}, false); } catch (e) {} AUTH = {token: null, who: AUTH.who}; saveAuth(); } else { askLogin().catch(() => {}); } };

async function initI18n() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try { saved = localStorage.getItem("dtm_lang"); } catch (e) {}
  LANG = q || saved || null;
  const r = await (await fetch(U(LANG ? `/api/i18n?lang=${encodeURIComponent(LANG)}` : "/api/i18n"))).json();
  LANG = r.lang; I18N = r.messages || {}; LOCALE = LOCALES[LANG] || "zh-TW";
  document.documentElement.lang = r.html_lang; document.body.style.fontFamily = r.font;
  const sel = $("#langSel");
  sel.innerHTML = Object.entries(r.langs).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join("");
  sel.value = LANG; $("#langW").hidden = Object.keys(r.langs).length <= 1;

/* ---------- charts ---------- */
const AXC = ["#A35F0E","#2F6F73","#5B6CB0","#B5462F","#6B7F2A","#7A4F9A","#8A9AA6"];
if (EMBED) AXC.splice(0, AXC.length, "#E8B04A", "#5FB8AE", "#8FA0E6", "#FF8A6B", "#A9C25A", "#B48AD6", "#A3B1BD");
function lineChart(svg, o) {
  const W = svg.clientWidth || 700, H = +(svg.getAttribute("height") || 240), L = 54, R = 12, T0 = 14, B = 26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const xs = o.x || [];
  let ys = [];
  (o.series || []).forEach(s => s.y.forEach(v => v !== null && ys.push(v)));
  if (o.band) { o.band.lo.forEach(v => v !== null && ys.push(v)); o.band.hi.forEach(v => v !== null && ys.push(v)); }
  (o.hlines || []).forEach(h => ys.push(h.y));
  if (!xs.length || !ys.length) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#4A5866">${esc(T("尚無資料"))}</text>`; return null; }
  let x0 = o.x0 ?? Math.min(...xs), x1 = o.x1 ?? Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (o.zero) { y0 = Math.min(y0, 0); y1 = Math.max(y1, 0); }
  const pad = (y1 - y0) * .08 || 1; y0 -= pad; y1 += pad; if (x1 === x0) x1 = x0 + 1;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T0 + (y1 - v) / (y1 - y0) * (H - T0 - B);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4;
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3E7EA"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#4A5866">${fmt(v, Math.abs(y1-y0) < 5 ? 2 : 0)}</text>`; }
  for (let i = 0; i <= 6; i++) { const v = x0 + (x1 - x0) * i / 6;
    g += `<text x="${X(v)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#4A5866">${esc(o.xfmt ? o.xfmt(v) : fmt(v, 1))}</text>`; }
  if (o.shade) o.shade.forEach(s => { g += `<rect x="${X(s.a)}" y="${T0}" width="${Math.max(1, X(s.b)-X(s.a))}" height="${H-T0-B}" fill="${s.c}" opacity="${s.o ?? .18}"/>`; });
  if (o.band) { let d = ""; xs.forEach((x, i) => { d += (i ? "L" : "M") + X(x) + "," + Y(o.band.hi[i]); });
    for (let i = xs.length - 1; i >= 0; i--) d += "L" + X(xs[i]) + "," + Y(o.band.lo[i]);
    g += `<path d="${d}Z" fill="${o.band.c || "#A35F0E"}" opacity=".18"/>`; }
  (o.series || []).forEach(s => { let d = "", on = false;
    s.y.forEach((v, i) => { if (v === null) { on = false; return; } d += (on ? "L" : "M") + X(xs[i]) + "," + Y(v); on = true; });
    g += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w || 1.6}" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`; });
  (o.hlines || []).forEach(h => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c}" stroke-dasharray="4 3"/>` +
    (h.label ? `<text x="${W-R-4}" y="${Y(h.y)-4}" text-anchor="end" font-size="11" fill="${h.c}">${esc(h.label)}</text>` : ""); });
  if (o.ylab) g += `<text x="${L}" y="${T0-3}" font-size="11" fill="#4A5866">${esc(o.ylab)}</text>`;
  svg.innerHTML = g;
  return {X, Y, L, R, W, H, T0, B};
}
function shareColor(s) {
  const t = Math.min(1, Math.sqrt(Math.max(0, s) / 0.35));
  const a = EMBED ? [26,35,43] : [246,247,248], b = [214,149,60], c = EMBED ? [255,107,74] : [181,70,47];
  const m = t < .5 ? a.map((v, i) => v + (b[i]-v) * t * 2) : b.map((v, i) => v + (c[i]-v) * (t - .5) * 2);
  return `rgb(${m.map(Math.round).join(",")})`;
}

        <table><tr><th>${esc(T("指標"))}</th><th class="num">${esc(T("改前"))}</th><th class="num">${esc(T("改後"))}</th><th class="num">${esc(T("效果"))}</th><th>${esc(T("95% 信賴區間"))}</th><th class="num">p</th></tr>
        ${R.rows.map(r => `<tr><td>${esc(r.label)}</td><td class="num">${r.key.startsWith("dmg") ? sci(r.before) : fmt(r.before, 2)}</td><td class="num">${r.key.startsWith("dmg") ? sci(r.after) : fmt(r.after, 2)}</td>
          <td class="num ${r.significant ? (r.effect < 0 ? "lv0" : "lv2") : ""}">${r.effect >= 0 ? "+" : ""}${fmt(r.effect * 100, 1)}%</td><td><div style="display:flex;align-items:center;gap:6px">${sv(r)}<span class="muted">${fmt(r.lo * 100, 1)}% ～ ${fmt(r.hi * 100, 1)}%</span></div></td><td class="num">${r.p === null ? "—" : fmt(r.p, 3)}</td></tr>`).join("")}</table>
        ${R.life.length ? `<h3>${esc(T("預估壽命"))}</h3><table><tr><th>${esc(T("軸"))}</th><th class="num">${esc(T("改前"))}</th><th class="num">${esc(T("改後"))}</th></tr>${R.life.filter(x => R.rows.some(r => r.key === "dmg" + x.ax)).map(x => `<tr><td>${esc(x.name)}</td><td class="num">${esc(yrs(x.before))}</td><td class="num">${esc(yrs(x.after))}</td></tr>`).join("")}</table>` : ""}
        ${R.diff && (R.diff.lines.length || R.diff.positions.length) ? `<h3>${esc(T("程式差異"))}</h3>${R.diff.lines.map(d => `<div class="diff"><span class="a code">${d.before.map(esc).join("<br>") || "—"}</span><span>→</span><span class="b code">${d.after.map(esc).join("<br>") || "—"}</span></div>`).join("")}
          ${R.diff.positions.map(p => `<div class="diff"><span class="a code">${esc(p.point)} ${esc(p.name)}</span><span>→</span><span class="b code">${Object.entries(p.diff).map(([k, v]) => `${k} ${v[0]} → ${v[1]}`).join(T("，"))}</span></div>`).join("")}` : ""}`;
    } catch (e) { $("#cOut").innerHTML = `<div class="warnbox">${esc(e.message)}</div>`; }
  };
  if ($("#cB").value && $("#cA").value) $("#cGo").click();
}

/* ---------- new session ---------- */
$("#newBtn").onclick = () => { $("#nRobot").value = INFO.robot || ""; $("#nRole").innerHTML = INFO.roles.map(r => `<option value="${r}">${esc(INFO.role_labels[r])}</option>`).join("");
  $("#nMsg").textContent = ""; $("#nParse").textContent = ""; $("#newModal").hidden = false; };
$("#newClose").onclick = () => { $("#newModal").hidden = true; };
let NEWTXT = "";
$("#nFile").onchange = async () => { const f = $("#nFile").files[0]; if (!f) return; NEWTXT = await f.text();
  try { const r = await post("/api/pro/parse", {text: NEWTXT});
    $("#nParse").textContent = T("程式 {n}：{k} 行、主流程動作行 {m} 個（關節值教導點 {j} 個）", {n: r.name, k: r.lines, m: r.motion, j: r.joint_points}) + (r.warnings.length ? " · " + r.warnings.join(T("；")) : ""); }
  catch (e) { $("#nParse").textContent = e.message; } };
$("#nOk").onclick = async () => {
  if (!NEWTXT) { $("#nMsg").textContent = T("請上傳程式的文字版（.LS）"); return; }
  try { const r = await post("/api/pro/session", {robot: $("#nRobot").value, role: $("#nRole").value, label: $("#nLabel").value, group: $("#nGroup").value,
      source: $("#nSource").value, change: $("#nChange").value, program: NEWTXT});
    $("#newModal").hidden = true; await loadSessions(r.id); }
  catch (e) { $("#nMsg").textContent = e.message; }
};
$("#allRobots").onchange = () => loadSessions(CUR && CUR.id);

(async () => { await initI18n(); renderWho(); await loadSessions(); })();

// ============================================================ clock and full-page screenshot (header; hidden when embedded)
(function () {
  const pad2 = x => String(x).padStart(2, "0");
  const fmt = d => { try { return new Intl.DateTimeFormat(LOCALE, {year: "numeric", month: "2-digit", day: "2-digit", weekday: "short",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"}).format(d); } catch (e) { return d.toLocaleString(); } };
  const clk = $("#clk");
  const tick = () => { if (clk) clk.textContent = fmt(new Date()); };
  tick(); setInterval(tick, 1000);
  const note = (t, ms) => {
    let n = $("#shotNote");
    if (!n) { n = document.createElement("div"); n.id = "shotNote";
      n.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99;background:#1F2A33;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:440px;box-shadow:0 4px 14px rgba(0,0,0,.25)";
      document.body.appendChild(n); }
    n.textContent = t; n.hidden = false; clearTimeout(n._t); n._t = setTimeout(() => { n.hidden = true; }, ms || 5000);
  };
  const btn = $("#shotBtn");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true; note(T("截圖中，請稍候…"), 20000);
    try {
      if (!window.html2canvas) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "vendor/html2canvas.min.js";
        sc.onload = res; sc.onerror = () => rej(new Error(T("載入截圖元件失敗"))); document.head.appendChild(sc); });
      const root = document.documentElement;
      const canvas = await window.html2canvas(document.body, {backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: Math.min(2, window.devicePixelRatio || 1), logging: false, windowWidth: root.scrollWidth, windowHeight: root.scrollHeight,
        scrollX: 0, scrollY: 0, x: 0, y: 0, width: root.scrollWidth, height: root.scrollHeight, ignoreElements: e => e.id === "shotNote",
        onclone: d => d.querySelectorAll("details").forEach(x => { if (!x.open) [...x.children].forEach(c => { if (c.tagName !== "SUMMARY") c.remove(); }); const s = x.querySelector("summary"); if (s) { s.style.display = "block"; s.style.listStyle = "none"; s.textContent = (x.open ? "▾ " : "▸ ") + s.textContent; } })});    // do not draw the content of closed <details>
      const d = new Date(), stamp = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
      const name = ("DTM_" + document.title.replace(/[\\/:*?"<>|\s·]+/g, "_").slice(0, 60) + "_" + stamp + ".png").replace(/_+/g, "_");
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
      note(T("已存成 {f}", {f: name}), 6000);
    } catch (e) { note(T("截圖失敗：{e}", {e: (e && e.message) || e}), 8000); }
    finally { btn.disabled = false; }
  };
})();
</script>
