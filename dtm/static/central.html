<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DTM 中央監控</title>
<style>
:root{
  --bg:#0E1419;--nav:#0A0F13;--card:#151D24;--card2:#1A232B;--line:#26323C;--line2:#1F2A33;--row:#222D36;
  --tx:#E6EBEF;--tx2:#C5D0D8;--mut:#A3B1BD;--mut2:#8D9CA8;--acc:#5AA9E6;--acc2:#7DBBEA;
  --ok:#3E8F88;--okf:#8FD3CA;--okb:#173A39;--cau:#E8B04A;--cauf:#F3C15A;--caub:#3F3013;
  --ale:#FF6B4A;--alef:#FF9A80;--aleb:#4A1F17;--base:#5D6C78;--sysf:#8CC4EE;--sysb:#1C2E40;
  --mono:Consolas,"IBM Plex Mono","Cascadia Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;font-size:14px;line-height:1.5}
a{color:var(--acc2);text-decoration:none}a:hover{color:#B9DBF5}
button{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav.side{flex:0 0 232px;background:var(--nav);border-right:1px solid var(--line2);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line2)}
.brand b{font-size:16px;letter-spacing:.5px;display:block}.brand small{font-size:12px;color:var(--mut2)}
.navl{display:flex;flex-direction:column;gap:2px}
.navl a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:#B5C2CC;font-weight:500}
.navl a svg path{stroke:var(--mut2)}
.navl a.on{background:#18232C;color:#fff;font-weight:700}.navl a.on svg path{stroke:var(--acc)}
.navl a .bd{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--alef)}
.sidebox{margin-top:auto;padding:14px;border-radius:10px;background:#121A21;border:1px solid var(--line2);font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
.sidebox .st{display:flex;align-items:center;gap:8px;color:var(--tx);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
main{flex:1 1 auto;min-width:0;padding:0 28px 40px;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 0;border-bottom:1px solid var(--line2)}
.crumb{font-size:12px;color:var(--mut2)}.crumb a{color:var(--mut2)}.crumb a:hover{color:var(--tx)}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.5px}
.sub{font-size:13px;color:var(--mut);margin-top:2px}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{padding:4px 10px;border-radius:999px;border:1px dashed #4A5866;color:var(--mut);font-size:12px}
.upd{font-size:12px;color:var(--mut)}.upd span{font-family:var(--mono);color:var(--tx)}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--mut2);position:relative}
.search input{background:transparent;border:0;outline:none;color:var(--tx);font:inherit;font-size:13px;width:190px}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--card2);border:1px solid var(--line);border-radius:8px;z-index:20;max-height:320px;overflow:auto;display:none}
.sres a{display:block;padding:8px 12px;color:var(--tx);border-bottom:1px solid var(--row)}.sres a:hover,.sres a.hl{background:#23303B}
.btn{height:44px;padding:0 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#3A4753;background:#18222A}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06121C;font-weight:700}.btn.pri:hover{background:#7DBBEA}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:6px}
.btn.dng{border-color:var(--ale);color:var(--alef);background:transparent;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bell{position:relative;width:44px;padding:0;justify-content:center}
.bell i{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--ale);color:#2A0B04;font-size:11px;font-weight:700;line-height:16px;text-align:center;font-style:normal;padding:0 3px}
.av{width:26px;height:26px;border-radius:50%;background:#23303B;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.kpi{flex:1 1 160px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.kpi.w2{flex:2 1 320px}
.kpi .l{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.kpi .v{display:flex;align-items:baseline;gap:6px;margin-top:6px;flex-wrap:wrap}
.kpi .v b{font-family:var(--mono);font-size:36px;font-weight:600;line-height:1.1}
.kpi .v .u{color:var(--mut)}
.kpi .n{font-size:12px;color:var(--mut2);margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700}
.card h3{margin:0;font-size:14px;font-weight:700}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:14px}
.ch .note{font-size:12px;color:var(--mut2)}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.lv2{background:var(--aleb);color:var(--alef)}.lv1{background:var(--caub);color:var(--cauf)}.lv0{background:var(--okb);color:var(--okf)}
.lvb{background:#26323C;color:var(--mut)}.lvs{background:var(--sysb);color:var(--sysf)}
.f2{color:#FF8A6B}.f1{color:var(--cauf)}.f0{color:var(--okf)}.fb{color:var(--mut)}
.mono{font-family:var(--mono)}.mut{color:var(--mut)}.mut2{color:var(--mut2)}.small{font-size:12px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.bar span{display:block;height:100%}
.bar.thin{height:8px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.grid-plants{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plant{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:10px;background:var(--card2);border:1px solid #2A3641;color:var(--tx);min-width:0;cursor:pointer}
.plant:hover{border-color:#3A4753;color:var(--tx)}
.plant .t{display:flex;align-items:center;justify-content:space-between;gap:8px}.plant .t b{font-size:18px}
.plant .ft{border-top:1px solid #2A3641;padding-top:10px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.alist .it{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.alist .it .c1{flex:0 0 70px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.alist .it .c2{flex:1 1 auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:8px 10px;background:var(--card2);white-space:nowrap}
.tbl th:first-child{border-radius:8px 0 0 8px}.tbl th:last-child{border-radius:0 8px 8px 0}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--row);vertical-align:middle}
.nw{white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#18222A}
.tbl .num{text-align:right;font-family:var(--mono)}
.scroll{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13px}
.tab[aria-pressed=true]{background:#1E2D3A;border-color:var(--acc);color:#fff;font-weight:700}
.langw{position:relative;display:inline-flex;align-items:center;color:var(--tx2)}.langw .globe{position:absolute;left:11px;pointer-events:none}.langw select{padding-left:33px;font-size:12px}.langw:hover{color:var(--tx)}
.tab .c{font-family:var(--mono);font-size:12px;color:var(--mut)}
.heat td.cell{text-align:center;font-family:var(--mono);font-size:12px;border-radius:4px;padding:6px 4px;min-width:52px;border:2px solid var(--bg)}
.heat td.cell.na{background:transparent;color:#3A4753}
.heat td.cell.b{background:#26323C;color:var(--mut2)}
.heat td.cell.l1{background:#5C4515;color:#FFE1A6}.heat td.cell.l2{background:#7A2A1B;color:#FFD3C7;font-weight:700}
.todo a{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--tx);align-items:flex-start}
.todo a:hover strong{color:var(--acc2)}
.ax-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.axc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.axc.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.axc .t{display:flex;justify-content:space-between;align-items:center}.axc .t b{font-size:16px}
.axc .v{display:flex;align-items:baseline;gap:6px;white-space:nowrap}.axc .v b{font-family:var(--mono);font-size:22px;font-weight:600}
.axc .nt{font-size:12px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.mk{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mk.y{background:var(--aleb);color:var(--alef)}.mk.m{background:var(--caub);color:var(--cauf)}.mk.n{background:#26323C;color:var(--mut)}
.sbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1 1 auto}.sbar span{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.kv div{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mut)}.kv strong{display:block;font-size:14px;color:var(--tx);font-family:var(--mono)}
.chips a{display:inline-block;margin:2px;padding:2px 8px;border-radius:6px;background:#23303B;color:var(--tx);font-size:12px}
.mx{display:grid;grid-template-columns:60px repeat(3,minmax(0,1fr));gap:6px;font-size:12px}
.mx .h{color:var(--mut);text-align:center;padding:4px}
.mx .cell{border-radius:8px;padding:8px;min-height:64px}
.mx .p1{background:#3A1A14;border:1px solid #6B2A1E}.mx .p2{background:#33280F;border:1px solid #5C4515}.mx .p3{background:#15282A;border:1px solid #23413F}
.gantt .gr{display:grid;grid-template-columns:28px 160px 70px 64px minmax(360px,1fr);gap:0 10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--row);font-size:13px}
.gantt .gr.hd{background:var(--card2);border-radius:8px;color:var(--mut);font-weight:700;font-size:12px;border:0}
.track{position:relative;height:22px}
.track .mline{position:absolute;top:-6px;bottom:-6px;border-left:1px dashed #2E3A45}
.track .band{position:absolute;top:7px;height:8px;border-radius:4px;opacity:.35}
.track .dia{position:absolute;top:4px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);border-radius:2px}
.track .job{position:absolute;top:3px;width:16px;height:16px;transform:translateX(-8px);border-radius:50%;border:2px solid var(--acc);background:transparent}
.track .tag{position:absolute;top:2px;font-size:11px;color:var(--mut2);white-space:nowrap}
.cal{position:relative}
.cal .lane{display:grid;grid-template-columns:70px 1fr;align-items:stretch;border-bottom:1px solid var(--row)}
.cal .lane .nm{padding:8px 4px;font-weight:700;font-size:13px}
.cal .lane .tr{position:relative;min-height:44px}
.cal .we{position:absolute;top:0;bottom:0;background:#10171D;border-left:1px solid #1C262E}
.cal .chip{position:absolute;top:6px;height:30px;padding:0 6px;border-radius:6px;font-size:11px;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#06121C;font-weight:700}
.cal .chip.tentative{background:transparent!important;border:1px dashed currentColor}
.cal .chip.done{opacity:.4}
.cal .today{position:absolute;top:0;bottom:0;border-left:2px solid var(--acc);z-index:2}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog span{display:block;height:100%;background:var(--acc)}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wp{background:var(--card2);border:1px solid #2A3641;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.wp .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;background:#26323C}
.sq.ok{background:var(--ok)}.sq.hit{background:var(--cau)}
.modal-bg{position:fixed;inset:0;background:rgba(3,7,10,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal.wide{width:min(720px,100%)}
.fld input[type=checkbox],.fld input[type=radio]{height:auto;padding:0;margin:2px 0 0;accent-color:var(--acc)}
.modal h2{margin:0 0 12px;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--mut)}
.fld input,.fld select,.fld textarea{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;padding:0 10px}
.fld textarea{height:70px;padding:8px 10px}
.fld.chk{flex-direction:row;align-items:center;gap:8px}.fld.chk input{height:auto}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.msg{font-size:13px;margin-top:6px;min-height:18px}.msg.err{color:var(--alef)}.msg.ok{color:var(--okf)}.wzax{display:grid;grid-template-columns:repeat(3,minmax(0,1fr) 96px);gap:2px 12px;align-items:center}.wzax .chk2{padding:4px 0}.wzax .inp{height:32px;width:100%}
@media (max-width:640px){.wzax{grid-template-columns:repeat(2,minmax(0,1fr) 96px)}}
@media (max-width:420px){.wzax{grid-template-columns:minmax(0,1fr) 110px}}
.msg.warn{color:var(--cauf);background:var(--caub);border-radius:8px;padding:8px 12px}
.toast{position:fixed;right:20px;bottom:20px;background:#1E2D3A;border:1px solid var(--acc);color:var(--tx);padding:12px 16px;border-radius:10px;z-index:60;display:none;max-width:420px}
.empty{color:var(--mut2);padding:16px 0;font-size:13px}
.preview{background:#0F171D;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.7}
.loading{color:var(--mut2);padding:40px 0;text-align:center}
.err-box{background:var(--aleb);color:var(--alef);border-radius:10px;padding:12px 16px}
.secbar{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.secbar>div{background:var(--caub);color:var(--cauf);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.secbar .btn{padding:4px 10px}
.secbar:empty{display:none}
.hide{display:none!important}
.gear{width:44px;padding:0;justify-content:center}
.umenu{position:relative}
.udrop{position:absolute;right:0;top:50px;min-width:250px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:40;display:none;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.udrop.on{display:block}
.udrop .hd{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.udrop .hd b{display:block;font-size:14px}.udrop .hd span{font-size:12px;color:var(--mut)}
.udrop a,.udrop button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;background:none;border:0;color:var(--tx);font-size:13px;cursor:pointer;text-align:left}
.udrop a:hover,.udrop button:hover{background:#22303B;color:var(--tx)}
.udrop svg{flex:none;color:var(--mut2)}
.navl a.subi{min-height:36px;padding:6px 12px 6px 44px;font-size:13px;line-height:1.3}
.navl .sep{height:1px;background:var(--line2);margin:8px 6px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frame{width:100%;border:0;display:block;background:var(--bg);min-height:480px}
.set{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.snav a{padding:10px 12px;border-radius:8px;color:var(--tx2);font-size:14px;display:flex;align-items:center;gap:10px}
.snav a:hover{background:#141D24;color:var(--tx)}
.snav a.on{background:#18232C;color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--acc)}
.snav .g{font-size:11px;color:var(--mut2);padding:14px 12px 4px;letter-spacing:.6px}
.sp{display:flex;flex-direction:column;gap:20px;min-width:0}
.sp .card>p.lead{margin:-6px 0 6px;font-size:13px;color:var(--mut)}
.srow{display:grid;grid-template-columns:minmax(200px,340px) minmax(0,1fr);gap:8px 28px;padding:14px 0;border-top:1px solid var(--row);align-items:start}
.srow.first,.srow:first-child{border-top:0}
.srow .lb b{display:block;font-size:14px;font-weight:600}.srow .lb span{font-size:12px;color:var(--mut2);line-height:1.55;display:block;margin-top:3px}
.srow .ct{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0}
.inp{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:13px;padding:0 10px;min-width:0}
.inp:focus,.fld input:focus,.fld select:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea.inp{height:auto;min-height:84px;padding:8px 10px;width:min(440px,100%);font-family:var(--mono);font-size:13px;line-height:1.5}
.inp.n{width:110px;font-family:var(--mono)}.inp.w{width:min(360px,100%)}
.tg{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.tg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;border-radius:13px;background:#2A3641;transition:background .15s}
.tg i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#C5D0D8;transition:transform .15s}
.tg input:checked+i{background:var(--acc)}.tg input:checked+i:before{transform:translateX(20px);background:#06121C}
.tg input:focus-visible+i{outline:2px solid var(--acc2);outline-offset:2px}.tg input:disabled+i{opacity:.5}
.src{font-size:11px;padding:2px 8px;border-radius:999px;background:#202B34;color:var(--mut2);white-space:nowrap}
.src.w{background:var(--sysb);color:var(--sysf)}
.kpi .v b.money{font-size:clamp(20px,2.1vw,30px);white-space:nowrap}
.clk{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--tx2);white-space:nowrap}
.ptag{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:11px;color:var(--tx2);margin:1px 3px 1px 0;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}.dlr{white-space:nowrap;font-size:12px}
.chk2{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px;color:var(--tx)}.chk2 span{display:flex;flex-direction:column}.chk2 small{color:var(--mut2)}

.chk .it .w{flex:0 0 auto;min-width:64px}
.ro{font-family:var(--mono);font-size:12px;color:var(--tx2);word-break:break-all}

.nlb{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);min-width:0;flex:1 1 220px}

function spark(vals, w = 128, h = 30, lo = 0.9, hi = 2.3, col = "#8FD3CA", cau = 1.5, ale = 2.0) {
  const v = (vals || []).filter(x => x != null);
  if (v.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  lo = Math.min(lo, ...v); hi = Math.max(hi, ...v);
  const y = x => (h - 3 - (x - lo) / (hi - lo) * (h - 6)).toFixed(1);
  const pts = v.map((x, i) => (i * (w - 2) / (v.length - 1)).toFixed(1) + "," + y(x)).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M0 ${y(cau)}H${w}M0 ${y(ale)}H${w}" stroke="#3A4753" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${w - 2}" cy="${y(v[v.length - 1])}" r="2.6" fill="${col}"/></svg>`;
}

function trendChart(t) {
  const W = 400, H = 170, x0 = 30, x1 = 396, y0 = 130, y1 = 10;
  const nPts = t.days.length;
  if (nPts < 2) return `<div class="empty">${esc(T("累積兩天以上的資料後顯示趨勢"))}</div>`;
  const mx = Math.max(4, ...t.caution, ...t.alert);
  const top = Math.ceil(mx / 4) * 4;
  const X = i => x0 + i * (x1 - x0) / (nPts - 1), Y = v => y0 - v / top * (y0 - y1);
  const pl = arr => arr.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
  const ticks = [0, top / 4, top / 2, top * 3 / 4, top];
  const d0 = new Date(t.days[0]).getTime() / 1000, d1 = new Date(t.days[nPts - 1]).getTime() / 1000;
  const xt = ts => x0 + (ts - d0) / Math.max(1, d1 - d0) * (x1 - x0);
  const lbl = [0, Math.floor(nPts / 3), Math.floor(2 * nPts / 3), nPts - 1].map(i => `<text x="${X(i)}" y="164" fill="#8D9CA8" font-size="10" text-anchor="${i === 0 ? "start" : (i === nPts - 1 ? "end" : "middle")}">${t.days[i].slice(5).replace("-", "/")}</text>`).join("");
  let lastLbl = -1e9;
  const evs = (t.events || []).slice(-8).map(e => { const x = xt(e.ts); if (x < x0 || x > x1) return "";
    const lb = x - lastLbl > 80 ? (lastLbl = x, `<text x="${Math.min(Math.max(x, x0 + 30), x1 - 30).toFixed(1)}" y="146" fill="#7DBBEA" font-size="10" text-anchor="middle">${esc(fmtD(e.ts) + " " + e.label.split(" ").slice(-1)[0])}</text>`) : "";
    return `<path d="M${x.toFixed(1)} 8V130" stroke="#7DBBEA" stroke-dasharray="4 3" opacity=".7"><title>${esc(fmtD(e.ts) + " " + e.label)}</title></path>${lb}`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(T("機群健康趨勢：注意軸數由 {a} 到 {b}，警戒軸數由 {c} 到 {d}", {a: t.caution[0], b: t.caution[nPts - 1], c: t.alert[0], d: t.alert[nPts - 1]}))}">
    <path d="${ticks.map(v => `M${x0} ${Y(v).toFixed(1)}H${x1}`).join("")}" stroke="#26323C"/>
    ${ticks.map(v => `<text x="22" y="${(Y(v) + 4).toFixed(1)}" fill="#8D9CA8" font-size="10" text-anchor="end">${Math.round(v)}</text>`).join("")}
    ${evs}<polyline points="${pl(t.caution)}" fill="none" stroke="#E8B04A" stroke-width="2" stroke-linejoin="round"/><polyline points="${pl(t.alert)}" fill="none" stroke="#FF6B4A" stroke-width="2" stroke-linejoin="round"/>${lbl}</svg>`;
}
function bindCommon() {
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = (e) => { if (e.target.closest("a,button")) return; location.hash = el.dataset.go; });
  document.querySelectorAll("[data-ack]").forEach(b => b.onclick = async () => {

}

function heatCls(c) { return c.lv < 0 ? "b" : (c.lv >= 2 ? "l2" : (c.lv === 1 ? "l1" : "l0")); }
function heatSty(c) {

  const r = Math.round(20 + t * 30), g = Math.round(52 + t * 52), b = Math.round(52 + t * 34);
  return `background:rgb(${r},${g},${b});color:#D8F1EC`;
}

function robotChart(pts, marks, cau, ale, days, sel) {
  const W = 720, H = 262, x0 = 44, x1 = 704, y0 = 226, y1 = 40;
  const P = (pts || []).filter(p => p.v != null);
  if (P.length < 2) return `<div class="empty">${esc(T("資料不足：至少要有兩天的判定結果"))}</div>`;
  const now = Date.now() / 1000, t0 = now - days * 86400;
  const vals = P.flatMap(p => [p.v, p.lo, p.hi]).filter(v => v != null);
  const lo = Math.min(0.9, ...vals), hi = Math.max(ale + 0.15, ...vals);
  const X = t => x0 + (t - t0) / (now - t0) * (x1 - x0), Y = v => y0 - (v - lo) / (hi - lo) * (y0 - y1);
  const band = P.filter(p => p.lo != null && p.hi != null);
  const bandPath = band.length > 1 ? "M" + band.map(p => X(p.ts).toFixed(1) + " " + Y(p.hi).toFixed(1)).join("L") + "L" + band.slice().reverse().map(p => X(p.ts).toFixed(1) + " " + Y(p.lo).toFixed(1)).join("L") + "Z" : "";
  const line = P.map(p => X(p.ts).toFixed(1) + "," + Y(p.v).toFixed(1)).join(" ");
  const last = P[P.length - 1];
  const temps = P.filter(p => p.temp != null);
  let tempSvg = "";
  if (temps.length > 1) {
    const tl = Math.min(...temps.map(p => p.temp)), tr = Math.max(...temps.map(p => p.temp));
    const TY = v => 52 - (v - tl) / Math.max(1, tr - tl) * 40;
    tempSvg = `<div class="small mut" style="display:flex;justify-content:space-between;margin-top:6px"><span>${esc(T("溫度 °C"))}</span><span class="mono">${n(tl, 1)}–${n(tr, 1)}</span></div><svg viewBox="0 0 720 60" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(T("同期間溫度 {a} 到 {b} 度", {a: n(tl, 1), b: n(tr, 1)}))}"><polyline points="${temps.map(p => X(p.ts).toFixed(1) + "," + TY(p.temp).toFixed(1)).join(" ")}" fill="none" stroke="#7FA5BF" stroke-width="1.5"/></svg>`;
  }
  const ticks = [lo, 1.0, cau, ale].filter((v, i, a) => v >= lo && v <= hi && a.indexOf(v) === i);
  const xl = [0, 1, 2, 3].map(i => { const t = t0 + i * (now - t0) / 3; return `<text x="${X(t).toFixed(0)}" y="252" fill="#8D9CA8" font-size="11" text-anchor="${i === 0 ? "start" : (i === 3 ? "end" : "middle")}">${fmtYMD(t).slice(5).replace("-", "/")}</text>`; }).join("");
  const mk = (marks || []).filter(m => m.ts >= t0).slice(-6).map((m, i) => `<path d="M${X(m.ts).toFixed(1)} ${y1 - 6}V${y0}" stroke="${m.iron ? "#8FD3CA" : "#C5D0D8"}" stroke-dasharray="3 4" opacity=".7"/><text x="${X(m.ts).toFixed(1)}" y="${18 + (i % 2) * 13}" fill="#C5D0D8" font-size="11" text-anchor="${X(m.ts) > 640 ? "end" : (X(m.ts) < 90 ? "start" : "middle")}">${esc(fmtD(m.ts) + " " + m.label)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(T("{ax} {d} 天比值由 {a} 到 {b}", {ax: sel.label, d: days, a: n(P[0].v), b: n(last.v)}))}">
    <rect x="${x0}" y="${Y(hi)}" width="${x1 - x0}" height="${Math.max(0, Y(ale) - Y(hi))}" fill="#FF6B4A" opacity=".06"/>
    <rect x="${x0}" y="${Y(ale)}" width="${x1 - x0}" height="${Math.max(0, Y(cau) - Y(ale))}" fill="#E8B04A" opacity=".06"/>
    ${ticks.map(v => `<path d="M${x0} ${Y(v).toFixed(1)}H${x1}" stroke="${v === cau ? "#E8B04A" : (v === ale ? "#FF6B4A" : "#26323C")}" ${v === cau || v === ale ? 'stroke-dasharray="6 4" opacity=".8"' : ""}/><text x="38" y="${(Y(v) + 4).toFixed(1)}" fill="#8D9CA8" font-size="11" text-anchor="end">${n(v, 1)}</text>`).join("")}
    <text x="${x0 + 6}" y="${(Y(cau) - 5).toFixed(1)}" fill="#F3C15A" font-size="11">${esc(lvn(1))} ${cau}</text><text x="${x0 + 6}" y="${(Y(ale) - 5).toFixed(1)}" fill="#FF9A80" font-size="11">${esc(lvn(2))} ${ale}</text>
    ${bandPath ? `<path d="${bandPath}" fill="#5AA9E6" opacity=".18"/>` : ""}${mk}
    <polyline points="${line}" fill="none" stroke="#5AA9E6" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last.ts).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5" fill="${LVCOL[sel.lv] || "#5AA9E6"}" stroke="#151D24" stroke-width="2"/>${xl}</svg>${tempSvg}`;
}
function lifeCurve(L) {
  if (!L.model || !L.curve) return `<div class="empty">${esc(T("尚無壽命模型（機群失效紀錄不足、也沒有設定先驗）"))}</div>`;
  const W = 320, H = 150, x0 = 36, x1 = 312, y0 = 136, y1 = 12, tmax = L.curve[L.curve.length - 1][0];
  const X = t => x0 + t / tmax * (x1 - x0), Y = r => y0 - r * (y0 - y1);
  const pts = L.curve.map(([t, r]) => X(t).toFixed(1) + "," + Y(r).toFixed(1)).join(" ");
  const age = L.age_h, rel = L.rel_now;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(T("可靠度曲線") + (age ? T("，本軸 {h} 小時位置可靠度約 {p}%", {h: int(age), p: n(rel * 100, 0)}) : ""))}">
    <path d="M${x0} ${Y(1)}H${x1}M${x0} ${Y(0.5)}H${x1}M${x0} ${Y(0)}H${x1}" stroke="#26323C"/>
    <text x="30" y="${Y(1) + 4}" fill="#8D9CA8" font-size="10" text-anchor="end">100%</text><text x="30" y="${Y(0.5) + 4}" fill="#8D9CA8" font-size="10" text-anchor="end">50%</text><text x="30" y="${Y(0) + 4}" fill="#8D9CA8" font-size="10" text-anchor="end">0%</text>
    <polyline points="${pts}" fill="none" stroke="#8FD3CA" stroke-width="2"/>
    ${L.b10_fleet ? `<path d="M${X(L.b10_fleet).toFixed(1)} ${y1}V${y0}" stroke="#E8B04A" stroke-dasharray="3 3"/><text x="${X(L.b10_fleet).toFixed(1)}" y="${y0 - 4}" fill="#F3C15A" font-size="10" text-anchor="middle">B10</text>` : ""}
    ${age && rel != null && age <= tmax ? `<circle cx="${X(age).toFixed(1)}" cy="${Y(rel).toFixed(1)}" r="4.5" fill="#FF6B4A" stroke="#151D24" stroke-width="2"/><text x="${Math.min(X(age) + 8, 250).toFixed(1)}" y="${Math.max(24, Y(rel) - 8).toFixed(1)}" fill="#FF9A80" font-size="11">${esc(T("本軸 {p}%", {p: n(rel * 100, 0)}))}</text>` : ""}
    <text x="${x0}" y="148" fill="#8D9CA8" font-size="10">0 h</text><text x="${x1}" y="148" fill="#8D9CA8" font-size="10" text-anchor="end">${int(tmax)} h</text></svg>`;
}

function bindPeople(reload) {
  const d = S.people || {};
  if ($("pAdd")) $("pAdd").onclick = () => personForm(null, reload);
  document.querySelectorAll("[data-pe]").forEach(b => b.onclick = () => personForm((d.people || []).find(p => p.id === b.dataset.pe), reload));
  document.querySelectorAll("[data-pon]").forEach(b => b.onclick = async () => {
    try { await post("/api/sys/notify/people", {action: "enable", id: b.dataset.pon, enabled: b.dataset.v === "1"}); toast(T("已儲存，10 秒內生效")); reload(); }
    catch (e) { toast(e.message); } });
  document.querySelectorAll("[data-pt]").forEach(b => b.onclick = async () => {
    const p = (d.people || []).find(x => x.id === b.dataset.pt);
    if (!p || !confirmBox(T("要發一則測試通知給 {n} 嗎？（用 {l}）", {n: p.name, l: p.lang_name}))) return;
    b.disabled = true;
    try { const r = await post("/api/sys/notify/people", {action: "test", id: p.id});
      toast((r.results || []).map(x => `${x.channel === "sms" ? T("簡訊") : "Email"} ${x.target || ""}${T("：")}${x.ok ? T("成功") : T("失敗") + " " + (x.detail || "")}`).join("\n") || T("沒有可發送的通道"), 8000); }
    catch (e) { toast(e.message, 6000); }
    finally { b.disabled = false; } });
}
function personForm(p, reload) {
  const d = S.people || {};

  openModal(`<h2>${esc(p ? T("修改收件人") : T("新增收件人"))}</h2><form id="pf">
    <label class="fld">${esc(T("姓名"))}<input id="pfN" maxlength="40" required value="${esc(p ? p.name : "")}"></label>
    <div class="row" style="gap:10px"><label class="fld" style="flex:1">${esc(T("手機號碼"))}<input id="pfP" maxlength="24" inputmode="tel" value="${esc(p ? p.phone : "")}" placeholder="0912345678"></label>
      <label class="fld" style="flex:1">Email<input id="pfE" maxlength="80" type="email" value="${esc(p ? p.email : "")}" placeholder="name@example.com"></label></div>
    <label class="fld">${esc(T("通知語言"))}<select id="pfL">${(d.langs || []).map(l => `<option value="${l.code}" ${l.code === (p ? p.lang || "" : "") ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>

    <div class="fld">${esc(T("接收哪些通知"))}${(d.groups || []).map(g => `<label class="chk2"><input type="checkbox" data-pg="${esc(g.key)}" ${g0.includes(g.key) ? "checked" : ""}><span>${esc(g.label)}<small>${esc(g.desc)}</small></span></label>`).join("")}</div>
    <div class="row" style="gap:10px"><label class="fld" style="flex:1">${esc(T("等級"))}<select id="pfV"><option value="1">${esc(T("注意以上"))}</option><option value="2" ${p && p.min_level >= 2 ? "selected" : ""}>${esc(T("只收警戒"))}</option></select></label>
      <label class="fld" style="flex:1">${esc(T("狀態"))}<select id="pfA"><option value="1">${esc(T("啟用"))}</option><option value="0" ${p && !p.enabled ? "selected" : ""}>${esc(T("停用"))}</option></select></label></div>
    <label class="fld">${esc(T("備註"))}<input id="pfR" maxlength="80" value="${esc(p ? p.note || "" : "")}" placeholder="${esc(T("例如：夜班、外籍技術員"))}"></label>
    <div class="msg err" id="pfM"></div>
    <div class="mact">${p ? `<button type="button" class="btn dng" id="pfDel" style="margin-right:auto">${esc(T("刪除"))}</button>` : ""}${BTN_CANCEL()}<button class="btn pri">${esc(T("儲存"))}</button></div></form>`, () => {
    $("pfN").focus();
    $("pf").onsubmit = async e => {
      e.preventDefault();
      const person = {id: p ? p.id : "", name: $("pfN").value, phone: $("pfP").value, email: $("pfE").value, lang: $("pfL").value,
        groups: [...document.querySelectorAll("[data-pg]")].filter(x => x.checked).map(x => x.dataset.pg),
        min_level: +$("pfV").value, enabled: $("pfA").value === "1", note: $("pfR").value};
      try { await post("/api/sys/notify/people", {action: "save", person}); closeModal(); toast(T("已儲存，10 秒內生效")); reload(); }
      catch (err) { $("pfM").textContent = err.message; }
    };
    if ($("pfDel")) $("pfDel").onclick = async () => {
      if (!confirmBox(T("確定刪除收件人 {n}？之後不會再收到通知", {n: p.name}))) return;

      catch (err) { $("pfM").textContent = err.message; }
    };
  });
}

function stackJobs(jobs) {
  // jobs on the same day are merged into one chip (+N), then stacked by date so they don't overlap
  const byDay = {};
  jobs.forEach(j => { const k = Math.floor(j.x); (byDay[k] = byDay[k] || []).push(j); });
  const ends = [], groups = [];
  Object.keys(byDay).map(Number).sort((a, b) => a - b).forEach(x => {
    let r = ends.findIndex(e => e <= x);
    if (r < 0) { r = ends.length; ends.push(0); }
    ends[r] = x + 2.7; groups.push({x, row: r, jobs: byDay[x]});
  });
  return {groups, rows: Math.max(1, ends.length)};
}
function pickJob(d, ids) {
  if (ids.length === 1) return jobForm(d, ids[0]);
  const js = ids.map(id => findJob(d, id)).filter(Boolean);
  openModal(`<h2>${esc(T("選擇保養項目"))}</h2>${js.map(j => `<div class="ev"><span class="mono mut" style="flex:0 0 46px">${j.date}</span><span style="flex:1 1 auto">${esc(j.robot)} ${esc(jobText(j))}</span><button class="btn sm" data-pick="${j.id}">${esc(T("完工 / 修改"))}</button></div>`).join("")}
    <div class="mact">${BTN_CLOSE()}</div>`, () => {
    document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { closeModal(); jobForm(d, +b.dataset.pick); });
  });

function weibullPlot(sel) {
  const W = 640, H = 372, x0 = 60, x1 = 620, y0 = 330, y1 = 20;
  const pts = sel.points || [];
  const all = pts.map(p => p[0]).concat(sel.eta_h ? [sel.eta_h * 0.15, sel.eta_h * 2] : []);
  if (all.length < 2) return `<div class="empty">${esc(T("失效紀錄不足 2 筆，無法畫機率圖"))}</div>`;
  const tmin = Math.pow(10, Math.floor(Math.log10(Math.min(...all)))), tmax = Math.pow(10, Math.ceil(Math.log10(Math.max(...all))));
  const fy = F => Math.log(-Math.log(1 - F));
  const ylo = fy(0.01), yhi = fy(0.99);
  const X = t => x0 + (Math.log10(t) - Math.log10(tmin)) / (Math.log10(tmax) - Math.log10(tmin)) * (x1 - x0);
  const Y = F => y0 - (fy(F) - ylo) / (yhi - ylo) * (y0 - y1);
  const yt = [0.01, 0.05, 0.1, 0.2, 0.5, 0.632, 0.9, 0.99];
  const xt = []; for (let t = tmin; t <= tmax * 1.01; t *= 10) { xt.push(t); if (t * 2 < tmax) xt.push(t * 2); if (t * 5 < tmax) xt.push(t * 5); }
  let fit = "";
  if (sel.beta && sel.eta_h) {
    const F = t => 1 - Math.exp(-Math.pow(t / sel.eta_h, sel.beta));
    const ts = [], st = Math.pow(tmax / tmin, 1 / 60);
    for (let t = tmin; t <= tmax; t *= st) { const f = F(t); if (f > 0.008 && f < 0.992) ts.push(X(t).toFixed(1) + "," + Y(f).toFixed(1)); }
    fit = `<polyline points="${ts.join(" ")}" fill="none" stroke="#5AA9E6" stroke-width="2"/>` + (sel.b10_h ? `<path d="M${X(sel.b10_h).toFixed(1)} ${y1}V${y0}" stroke="#E8B04A" stroke-dasharray="4 3"/><text x="${(X(sel.b10_h) + 4).toFixed(1)}" y="${y1 + 12}" fill="#F3C15A" font-size="11">B10 ${int(sel.b10_h)} h</text>` : "");
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(T("{ax} Weibull 機率圖：{n} 筆更換，β {b}、η {e} 小時", {ax: sel.label, n: pts.length, b: n(sel.beta, 2), e: int(sel.eta_h)}))}">
    ${yt.map(F => `<path d="M${x0} ${Y(F).toFixed(1)}H${x1}" stroke="#26323C"/><text x="${x0 - 6}" y="${(Y(F) + 4).toFixed(1)}" fill="#8D9CA8" font-size="11" text-anchor="end">${(F * 100).toFixed(0)}%</text>`).join("")}
    ${xt.map(t => `<path d="M${X(t).toFixed(1)} ${y1}V${y0}" stroke="#1F2A33"/><text x="${X(t).toFixed(1)}" y="${y0 + 18}" fill="#8D9CA8" font-size="11" text-anchor="middle">${t >= 1000 ? (t / 1000) + "k" : t}</text>`).join("")}
    <text x="${(x0 + x1) / 2}" y="${H - 4}" fill="#8D9CA8" font-size="11" text-anchor="middle">${esc(T("運轉時數（h，對數刻度）"))}</text>
    <text x="14" y="${(y0 + y1) / 2}" fill="#8D9CA8" font-size="11" text-anchor="middle" transform="rotate(-90 14 ${(y0 + y1) / 2})">${esc(T("累積失效機率"))}</text>
    ${fit}${pts.map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(Math.min(0.99, Math.max(0.01, p[1]))).toFixed(1)}" r="5" fill="#FF8A6B" stroke="#151D24" stroke-width="1.5"><title>${int(p[0])} h · ${n(p[1] * 100, 1)}%</title></circle>`).join("")}</svg>`;
}

function latencyChart(series) {
  const W = 560, H = 230, x0 = 46, x1 = 548, y0 = 200, y1 = 12;
  if (!series.length) return `<div class="empty">${esc(T("沒有資料"))}</div>`;
  const now = Date.now() / 1000, t0 = now - 86400;
  const Y = v => { v = Math.max(0, v || 0); return v <= 30 ? y0 - v / 30 * (y0 - y1) * 0.6 : y0 - (y0 - y1) * (0.6 + 0.4 * Math.min(1, Math.log10(v / 30) / Math.log10(10))); };
  const X = t => x0 + (t - t0) / 86400 * (x1 - x0);
  const worst = series.slice().sort((a, b) => Math.max(...b.points.map(p => p[1] || 0)) - Math.max(...a.points.map(p => p[1] || 0)))[0];
  const ticks = [0, 10, 20, 30, 60, 120, 300];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(T("過去 24 小時各廠資料延遲"))}">
    ${ticks.map(v => `<path d="M${x0} ${Y(v).toFixed(1)}H${x1}" stroke="#26323C"/><text x="${x0 - 6}" y="${(Y(v) + 4).toFixed(1)}" fill="#8D9CA8" font-size="10" text-anchor="end">${v < 60 ? v + "s" : v / 60 + "m"}</text>`).join("")}
    ${series.map(s => `<polyline points="${s.points.filter(p => p[0] >= t0).map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${s === worst ? "#E8B04A" : "#3D6E99"}" stroke-width="${s === worst ? 2 : 1.2}" opacity="${s === worst ? 1 : .8}"/>`).join("")}
    ${[0, 6, 12, 18, 24].map(hh => { const t = t0 + hh * 3600; return `<text x="${X(t).toFixed(0)}" y="${y0 + 18}" fill="#8D9CA8" font-size="10" text-anchor="${hh === 0 ? "start" : (hh === 24 ? "end" : "middle")}">${pad(new Date(t * 1000).getHours())}:00</text>`; }).join("")}
    <text x="${x1}" y="${y1 + 4}" fill="#F3C15A" font-size="11" text-anchor="end">${esc(T("{name}（24 小時最大延遲）", {name: worst.name}))}</text></svg>`;
}

function clockText(d) {

    minute: "2-digit", second: "2-digit", hourCycle: "h23"}).format(d); }

}
function tickClock() {
  const el = $("clk"); if (!el) return;
  const d = new Date(); el.textContent = clockText(d);
  if (!el.title) { const off = -d.getTimezoneOffset(), tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "";
    el.title = `${tz} (UTC${off >= 0 ? "+" : "-"}${pad(Math.floor(Math.abs(off) / 60))}:${pad(Math.abs(off) % 60)})`; }
}
setInterval(tickClock, 1000);
function stampName(title) {
  const d = new Date(), t = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  return ("DTM_" + (title || "page").replace(/[\\/:*?"<>|\s·]+/g, "_").replace(/_+/g, "_").slice(0, 60) + "_" + t + ".png").replace("__", "_");
}
const SHOT_CSS = ["width", "height", "padding-top", "padding-right", "padding-bottom", "padding-left", "border-top", "border-right",
  "border-bottom", "border-left", "border-radius", "background-color", "color", "font-size", "font-family", "font-weight", "gap"];
function shotFix(doc, src) {
  // html2canvas draws form controls poorly: swap selects, buttons and inputs for plain elements with the computed styles
  const pairs = (sel) => { const a = [...src.querySelectorAll(sel)].filter(x => !x.closest("#toast,#mbg")), b = doc.querySelectorAll(sel);
    return a.length === b.length ? [...b].map((el, i) => [el, a[i]]) : []; };      // counts differ: leave as html2canvas draws it
  const flat = (o, tag, text) => { const st = src.defaultView.getComputedStyle(o), sp = doc.createElement(tag);
    const disp = st.display === "none" ? "none" : st.display.includes("flex") ? st.display : st.display.startsWith("inline") ? "inline-flex" : "flex";
    const jc = st.justifyContent && st.justifyContent !== "normal" ? st.justifyContent : o.tagName === "BUTTON" ? "center" : "flex-start";
    sp.style.cssText = SHOT_CSS.map(k => k + ":" + st.getPropertyValue(k)).join(";") + ";display:" + disp +
      ";align-items:center;justify-content:" + jc + ";box-sizing:border-box;white-space:nowrap;overflow:hidden;vertical-align:middle";
    if (text !== undefined) sp.textContent = text;
    return sp; };
  pairs("select").forEach(([el, o]) => el.replaceWith(flat(o, "span", o.options[o.selectedIndex] ? o.options[o.selectedIndex].text : "")));
  pairs("input:not([type=checkbox]):not([type=radio]):not([type=hidden])").forEach(([el, o]) => {
    const sp = flat(o, "span", o.value || o.placeholder || ""); if (!o.value) sp.style.opacity = ".6"; el.replaceWith(sp); });
  pairs("button").forEach(([el, o]) => { const sp = flat(o, "span"); sp.className = el.className; while (el.firstChild) sp.appendChild(el.firstChild); el.replaceWith(sp); });
  const nav = doc.querySelector("nav.side"); if (nav) { nav.style.position = "static"; nav.style.height = "auto"; }
  doc.querySelectorAll(".umenu").forEach(u => { u.style.display = "contents"; });          // html2canvas skips the text inside this wrapper
  doc.querySelectorAll(".langw .globe").forEach(g => g.remove());       // html2canvas cannot draw the globe laid over the select
  const d = doc; d.querySelectorAll("details").forEach(x => { if (!x.open) [...x.children].forEach(c => { if (c.tagName !== "SUMMARY") c.remove(); }); const s = x.querySelector("summary"); if (s) { s.style.display = "block"; s.style.listStyle = "none"; s.textContent = (x.open ? "▾ " : "▸ ") + s.textContent; } });   // do not draw the content of closed <details>
}
async function shotOf(doc, win, scale, skipFrames) {
  const root = doc.documentElement;
  return window.html2canvas(doc.body, {backgroundColor: win.getComputedStyle(doc.body).backgroundColor, scale, logging: false, useCORS: true,
    windowWidth: root.scrollWidth, windowHeight: root.scrollHeight, scrollX: 0, scrollY: 0, x: 0, y: 0, width: root.scrollWidth,
    height: Math.max(root.scrollHeight, doc.body.scrollHeight),
    ignoreElements: e => e.id === "toast" || e.id === "mbg" || (skipFrames && e.tagName === "IFRAME"),
    onclone: d => shotFix(d, doc)});
}
async function fullShot(btn) {
  if (btn) btn.disabled = true;
  toast(T("截圖中，請稍候…"), 20000);
  try {
    if (!window.html2canvas) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "vendor/html2canvas.min.js";
      sc.onload = res; sc.onerror = () => rej(new Error(T("載入截圖元件失敗"))); document.head.appendChild(sc); });
    const scale = Math.min(2, window.devicePixelRatio || 1), bg = getComputedStyle(document.body).backgroundColor;
    const fr = $("frame");
    let inner = null, box = null;
    if (fr) {                                       // live / Pro page inside the window: capture its whole page and splice it in
      try { const d = fr.contentDocument;
        if (d && d.body) { const r = fr.getBoundingClientRect(); box = {x: r.left + window.scrollX, y: r.top + window.scrollY, h: r.height};
          inner = await shotOf(d, fr.contentWindow, scale); } } catch (e) { inner = null; }
    }
    let canvas = await shotOf(document, window, scale, !!inner);
    if (inner) {
      const y0 = Math.round(box.y * scale), y1 = Math.round((box.y + box.h) * scale), x0 = Math.round(box.x * scale);
      const out = document.createElement("canvas");
      out.width = canvas.width; out.height = Math.max(canvas.height, y0 + inner.height + (canvas.height - y1));
      const g = out.getContext("2d");
      g.fillStyle = bg; g.fillRect(0, 0, out.width, out.height);
      g.drawImage(canvas, 0, 0);
      const px = canvas.getContext("2d").getImageData(2, canvas.height - 2, 1, 1).data;      // extend the side menu to the bottom
      g.fillStyle = `rgb(${px[0]},${px[1]},${px[2]})`; g.fillRect(0, canvas.height, Math.max(0, x0 - 2), out.height - canvas.height);
      g.fillStyle = bg; g.fillRect(x0, y0, out.width - x0, y1 - y0);
      g.drawImage(inner, x0, y0);
      if (canvas.height > y1) g.drawImage(canvas, 0, y1, canvas.width, canvas.height - y1, 0, y0 + inner.height, canvas.width, canvas.height - y1);
      canvas = out;
    }
    const name = stampName(($("title") || {}).textContent || document.title);
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    toast(T("已存成 {f}", {f: name}), 6000);
  } catch (e) { toast(T("截圖失敗：{e}", {e: (e && e.message) || e}), 8000); }
  finally { if (btn) btn.disabled = false; }
}

function fieldRow(f, edit) {

  else if (f.type === "int" || f.type === "float") ctl = `<input class="inp n" id="${id}" type="number" ${f.type === "float" ? 'step="0.5"' : ""} min="${f.lo}" max="${f.hi}" value="${esc(f.value)}" ${edit ? "" : "disabled"} aria-label="${esc(f.label)}"><span class="small mut">${esc(f.unit)}</span>`;
  else if (f.type === "lang") ctl = `<select class="inp" id="${id}" ${edit ? "" : "disabled"} aria-label="${esc(f.label)}">${(S.setData.langs || []).map(l => `<option value="${l.code}" ${l.code === f.value ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>`;
  else if (f.type === "iplist") ctl = `<textarea class="inp" id="${id}" rows="3" ${edit ? "" : "disabled"} placeholder="192.168.10.0/24" aria-label="${esc(f.label)}">${esc((f.value || []).join("\n"))}</textarea>`;
  else if (f.type === "choice") ctl = `<select class="inp" id="${id}" ${edit ? "" : "disabled"} aria-label="${esc(f.label)}">${(f.options || []).map(o => `<option value="${esc(o.v)}" ${o.v === f.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;

  else ctl = `<input class="inp w" id="${id}" value="${esc(f.value)}" maxlength="${f.max || 100}" ${edit ? "" : "disabled"} aria-label="${esc(f.label)}">`;
  const src = f.web ? `<span class="src w" title="${esc(T("設定檔的值：{v}", {v: fmtVal(f, f.file)}))}">${esc(T("網頁設定"))}</span>${edit ? ` <button type="button" class="lnk" data-reset="${esc(f.key)}">${esc(T("恢復設定檔的值"))}</button>` : ""}`

function fmtVal(f, v) {

  if (f.type === "lang") return ((S.setData.langs || []).find(l => l.code === v) || {}).name || v;
  if (f.type === "choice") return ((f.options || []).find(o => o.v === v) || {}).label || v;

function readField(f) {

function tempPw() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz", d = "23456789", r = new Uint32Array(12);

}

    ${(n.rules || []).map((r, i) => `<div class="srow"><div class="lb"><b>${esc(T(r.name) || T("（未命名規則）"))}</b><span>${esc(T("通道：{c}", {c: (r.channels || []).join(SEP()) || "—"}))}${r.duty ? " · " + esc(T("另外發給值班人員")) : ""}${r.people ? " · " + esc(T("收件人名單 {n} 位", {n: r.people})) : ""}</span>
        <span style="margin-top:8px;display:flex;gap:10px;align-items:center"><label class="tg"><input type="checkbox" id="nEn${i}" ${r.enabled !== false ? "checked" : ""} ${edit ? "" : "disabled"} aria-label="${esc(T("啟用"))}"><i></i></label>${esc(T("啟用"))}</span></div>
      <div class="ct"><label class="nlb">Email<textarea class="inp" id="nE${i}" rows="3" ${edit ? "" : "disabled"}>${esc(list(r.email))}</textarea></label>
        <label class="nlb">${esc(T("手機號碼"))}<textarea class="inp" id="nS${i}" rows="3" ${edit ? "" : "disabled"}>${esc(list(r.sms))}</textarea></label>
        <label class="nlb">${esc(T("通知語言"))}<select class="inp" id="nL${i}" ${edit ? "" : "disabled"}>${langs.map(l => `<option value="${l.code}" ${l.code === (r.lang || "") ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></label></div></div>`).join("")}
    ${(n.rules || []).length ? "" : `<div class="note2" style="margin-top:8px">${esc(T("設定檔沒有通知規則（[[notify.rules]]）：所有通知發給預設收件人。要依等級、廠區、時段分送，請在設定檔加規則（見 config.example.toml）。"))}</div>`}
    <div class="sfoot"><span class="msg" id="nMsg"></span>${edit && S.setData.notify_web ? `<button type="button" class="btn sm" id="nReset">${esc(T("恢復設定檔的值"))}</button>` : ""}<button type="button" class="btn" id="nTest" ${edit ? "" : "disabled"}>${esc(T("發送測試通知"))}</button>${edit ? `<button type="button" class="btn pri" id="nSave">${esc(T("儲存"))}</button>` : ""}</div></section>`;
};
SEC_VIEWS.service = async function () {
  const v = await apiOr("/api/sys/vendor", null);
  S.afterRender = () => { bindFields(); if (v && !v._err) bindVendor(v); };
  return fieldsCard("service", T("服務商"), T("「保養與備品」頁底部顯示原廠服務據點與貴廠的服務窗口；原廠據點依觀看者的畫面語言自動選擇，也可以在這裡指定。")) +
    (v && !v._err ? vendorCard(v) : "");
};
SEC_VIEWS.system = async function () {
  const i = await apiOr("/api/sys/info", {});
  const ck = isAdmin() ? await apiOr("/api/sys/check", {items: []}) : null;
  const bk = i.backup || {};
  S.afterRender = () => {
    if ($("bkNow")) $("bkNow").onclick = async () => { $("bkNow").disabled = true; try { const r = await post("/api/sys/backup"); toast(T("已備份：{f}（{s}）", {f: r.file, s: bytes(r.bytes)}), 7000); VIEWS.settings("system", true); } catch (e) { toast(e.message, 7000); } finally { if ($("bkNow")) $("bkNow").disabled = false; } };
    if ($("dgNow")) $("dgNow").onclick = async () => { try { const r = await post("/api/sys/diag");
      const f = await fetch(withLang(r.url), {headers: {"X-DTM-Token": S.token}}); if (!f.ok) throw new Error(T("下載失敗"));
      const b = await f.blob(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = r.name; a.click(); toast(T("已產生診斷包 {n}", {n: r.name})); } catch (e) { toast(e.message, 7000); } };
  };
  const lvTag = l => l === "error" ? `<span class="lv lv2">${esc(T("錯誤"))}</span>` : l === "warn" ? `<span class="lv lv1">${esc(T("警告"))}</span>` : l === "hint" ? `<span class="lv lvs">${esc(T("提示"))}</span>` : `<span class="lv lv0">${esc(T("正常"))}</span>`;
  return `<section class="card"><div class="ch"><h2>${esc(T("系統資訊"))}</h2>${i.demo ? `<span class="pill">${esc(T("演示資料"))}</span>` : ""}</div>
    <div class="stat">
      <div><span>${esc(T("版本"))}</span><b>DTM v${esc(i.version || "")}</b><small>${esc(T("Beta：判斷門檻待現場驗證"))}</small></div>
      <div><span>${esc(T("執行模式"))}</span><b>${esc(i.role_name || "")}</b><small>${esc({accounts: T("個人帳號"), password: T("共用密碼"), readonly: T("唯讀（尚未建立帳號）"), demo: T("演示（免登入）")}[i.mode] || "")}</small></div>
      <div><span>${esc(T("主機"))}</span><b>${esc(i.host || "")}</b><small>${esc(i.os || "")} · Python ${esc(i.python || "")}</small></div>
      <div><span>${esc(T("連續運作"))}</span><b>${esc(dur(i.uptime_s))}</b><small>${esc(T("啟動於 {t}", {t: dt(i.started)}))}</small></div>
      <div><span>${esc(T("網頁"))}</span><b>${esc((i.tls ? "https" : "http") + "://" + (i.web_host || "") + ":" + (i.web_port || ""))}</b><small>${esc(i.tls ? T("已加密（HTTPS）") : T("未加密：只建議在本機或內部網路使用"))}</small></div>
      <div><span>${esc(T("磁碟剩餘"))}</span><b>${esc(i.disk ? (i.disk.free_gb + " GB · " + i.disk.free_pct + "%") : "—")}</b><small>${esc(T("共 {n} GB", {n: i.disk ? i.disk.total_gb : "—"}))}</small></div>
      ${(i.dbs || []).map(d => `<div><span>${esc(d.name)}</span><b>${esc(bytes(d.bytes))}</b><small>${esc(d.path)}</small></div>`).join("")}
      ${i.config ? `<div><span>${esc(T("設定檔"))}</span><b style="font-size:13px">${esc(i.config.split(/[\\/]/).pop())}</b><small>${esc(i.config)}</small></div>` : ""}
    </div></section>
  <section class="card"><div class="ch"><h2>${esc(T("備份"))}</h2><span class="note">${esc(bk.dir ? T("每天 {h} 點自動備份", {h: bk.hour ?? 3}) : T("沒有啟用自動備份（[storage] backup_dir）"))}</span>${isAdmin() ? `<span class="r"><button type="button" class="btn sm" id="bkNow" ${bk.can_run ? "" : "disabled"}>${esc(T("立即備份"))}</button></span>` : ""}</div>
    <div class="stat"><div><span>${esc(T("最近一次"))}</span><b class="${bk.dir && !bk.last_ts ? "f2" : ""}">${esc(bk.last_ts ? dt(bk.last_ts) + " · " + ago(bk.last_ts) : (bk.dir ? T("還沒有備份") : "—"))}</b><small>${esc(T("共 {n} 份", {n: bk.count ?? 0}))}</small></div>
      <div><span>${esc(T("備份資料夾"))}</span><b style="font-size:13px" class="ro">${esc(bk.dir || "—")}</b></div>
      <div><span>${esc(T("網路資料夾（第二份）"))}</span><b style="font-size:13px" class="ro">${esc(bk.mirror || T("未設定"))}</b></div></div>
    ${S.info.role === "standalone" ? `<div class="small mut2" style="margin-top:10px">${esc(T("還原：「即時監測」頁的「資料還原」，或指令 python -m dtm restore"))}</div>` : ""}</section>
  <section class="card"><div class="ch"><h2>${esc(T("自我檢查"))}</h2><span class="note">${esc(T("資料庫完整性、磁碟空間、設定"))}</span></div>
    <div class="chk">${(i.selfcheck || []).map(c => `<div class="it"><span class="w">${lvTag(c.level)}</span><span><b>${esc(c.name)}</b> <span class="mut">${esc(c.detail || "")}</span></span></div>`).join("") || `<div class="empty">—</div>`}</div></section>
  ${ck ? `<section class="card"><div class="ch"><h2>${esc(T("設定檔檢查"))}</h2><span class="note">${esc(ck.path || ck.note || "")}</span>${ck.path ? `<span class="r small">${esc(T("錯誤 {e}、警告 {w}", {e: ck.errors || 0, w: ck.warnings || 0}))}</span>` : ""}</div>
    <div class="chk">${(ck.items || []).map(c => `<div class="it"><span class="w">${lvTag(c.level)}</span><span>${c.where ? `<span class="mono small">${esc(c.where)}</span> ` : ""}<span class="mut">${esc(c.msg)}</span></span></div>`).join("") || `<div class="empty">${esc(ck.note || T("設定檔沒有問題"))}</div>`}</div></section>` : ""}
  <section class="card"><div class="ch"><h2>${esc(T("連線與資料位置"))}</h2><span class="note">${esc(T("只顯示；改錯會讓監測中斷，請改設定檔，先執行 python -m dtm check 再重新啟動"))}</span></div>
    ${(S.setData.readonly || []).map(g => `<h3 style="margin:10px 0 6px">${esc(g.title)}</h3>${g.items.map(x => `<div class="srow" style="padding:8px 0"><div class="lb"><span class="mono" style="margin:0">${esc(x.key)}</span></div><div class="ct ro">${esc(Array.isArray(x.value) ? x.value.join(", ") : x.value)}</div></div>`).join("")}`).join("")}</section>
  ${S.info.role === "standalone" && isAdmin() && !STATIC ? `<section class="card"><div class="ch"><h2>${esc(T("第一次設定精靈"))}</h2><span class="r"><button type="button" class="btn sm" onclick="showWizard()">${esc(T("開啟精靈"))}</button></span></div>
    <p class="lead">${esc(T("資料來源與控制器 IP、連線測試、監測軸與額定扭矩。只能在這台電腦本機操作；儲存後重新啟動 DTM 生效。"))}</p></section>` : ""}
  <section class="card"><div class="ch"><h2>${esc(T("現場驗證報告"))}</h2><span class="r"><button type="button" class="btn sm" onclick="openHtml(validationUrl(), 'validation.html')">${esc(T("產生報告"))}</button></span></div>
    <p class="lead">${esc(T("拿實際的更換與拆檢紀錄檢查判斷準不準：失效前有沒有先出現注意或警戒、提早幾天、漏報幾件、哪些警戒之後沒有處置（誤報候選）。可以列印成 A4 給主管或供應商。指令：python -m dtm validation"))}</p></section>
  ${isAdmin() ? `<section class="card"><div class="ch"><h2>${esc(T("診斷包"))}</h2><span class="r"><button type="button" class="btn sm" id="dgNow">${esc(T("下載診斷包"))}</button></span></div>
    <p class="lead">${esc(T("給維護人員或回報問題用：版本、設定檔（密碼、金鑰、網址、Email、電話已遮蔽）、檢查結果、最近的記錄檔。不含監測資料庫與帳號。記錄檔可能有 IP 與操作人姓名，寄出前可以先打開檢查。"))}</p></section>` : ""}`;
};
SEC_VIEWS.history = async function () {
  if (!isAdmin()) return `<section class="card"><div class="note2">${esc(T("這個畫面只有管理員可以看"))}</div></section>`;
  const h = await apiOr("/api/sys/settings/history?limit=200", {rows: []});
  const show = (r, k) => { const v = r[k]; if (r.key === "notify.recipients") return v ? T("（收件人清單）") : "—"; const f = (S.setData.fields || []).find(x => x.key === r.key);
    return f ? fmtVal(f, v) : JSON.stringify(v); };
  S.afterRender = () => document.querySelectorAll("[data-rev]").forEach(b => b.onclick = async () => {
    if (!confirmBox(T("把這一項還原成修改前的值？"))) return;
    try { await post("/api/sys/settings/revert", {id: +b.dataset.rev}); toast(T("已還原")); VIEWS.settings("history", true); } catch (e) { toast(e.message, 6000); } });
  return `<section class="card"><div class="ch"><h2>${esc(T("系統設定修改紀錄"))}</h2><span class="note">${esc(T("每次修改的舊值與新值；可以一鍵還原"))}</span></div>
    <div class="scroll"><table class="tbl" style="min-width:760px"><thead><tr><th>${esc(T("時間"))}</th><th>${esc(T("人員"))}</th><th>${esc(T("電腦"))}</th><th>${esc(T("項目"))}</th><th>${esc(T("修改前"))}</th><th>${esc(T("修改後"))}</th><th></th></tr></thead><tbody>
    ${(h.rows || []).map(r => `<tr><td class="mono small nw">${esc(dt(r.ts))}</td><td>${esc(r.who || "—")}</td><td class="mono small">${esc(r.addr || "")}</td><td>${esc(r.label)}</td>
      <td class="small">${esc(show(r, "old"))}${r.old_file ? ` <span class="src">${esc(T("設定檔"))}</span>` : ""}</td><td class="small">${esc(show(r, "new"))}${r.new_file ? ` <span class="src">${esc(T("設定檔"))}</span>` : ""}</td>
      <td><button type="button" class="btn sm" data-rev="${r.id}">${esc(T("還原"))}</button></td></tr>`).join("") || `<tr><td colspan="7" class="empty">${esc(T("還沒有修改過系統設定"))}</td></tr>`}
    </tbody></table></div></section>`;
};
SEC_VIEWS.about = async function () {
  const a = await api("/api/c/about");
  return `<section class="card"><div class="ch"><h2>${esc(a.title)}</h2><span class="lv lv1">${esc(a.stage)}</span></div>
    <div class="stat" style="margin-bottom:14px"><div><span>${esc(T("版本"))}</span><b>v${esc(a.version)}</b></div><div><span>${esc(T("作者"))}</span><b>${esc(a.author)}</b></div><div><span>${esc(T("授權"))}</span><b>${esc(a.license)}</b></div></div>
    ${a.items.map(x => `<div class="srow"><div class="lb"><b>${esc(x.h)}</b></div><div class="ct small" style="line-height:1.7;color:var(--tx2)">${esc(x.t)}</div></div>`).join("")}</section>`;
};
VIEWS.settings = async function (sec, keep) {
  if (STATIC) {
    setHead(crumbs(esc(T("設定"))), T("設定"));
    $("view").innerHTML = await SEC_VIEWS.about().catch(() => `<section class="card"><div class="note2">${esc(STATIC_MSG())}</div></section>`);
    return;
  }
  if (!keep) { S.auditQ = ""; S.auditFail = false; S.auditRobot = ""; }
  S.me = await apiOr("/api/sys/me", {});
  S.policy = S.me.policy || S.policy;
  const admin = isAdmin(), acc = (S.info || {}).auth_mode === "accounts", mode = (S.info || {}).auth_mode;
  const anon = !S.who && mode !== "demo";                          // not logged in: only account and about
  S.setData = anon ? {fields: [], langs: [], readonly: [], notify: {hidden: true}, can_edit: false}
    : await apiOr("/api/sys/settings", {fields: [], langs: [], readonly: [], notify: {hidden: true}, can_edit: false});
  const vis = SET_SECS.filter(([k]) => anon ? ["account", "about"].includes(k) : (!["users", "history"].includes(k) || admin));
  if (!sec || !vis.some(([k]) => k === sec)) sec = acc && S.who ? "account" : "general";
  const title = T((SET_SECS.find(x => x[0] === sec) || [, "設定"])[1]);
  setHead(S.info.role === "standalone" ? esc(S.info.title) + " / " + esc(T("設定")) : crumbs(esc(T("設定"))), T("設定"),
    esc(anon ? T("登入後可以看到系統設定；修改限管理員") : (admin ? T("帳號、安全、通知與系統；修改都會記錄，可以還原") : T("非管理員只能看，不能修改"))));
  S.afterRender = null;
  let body;
  try { body = await SEC_VIEWS[sec](); } catch (e) { body = `<div class="err-box">${esc(e.message)}</div>`; }
  let grp = "";
  $("view").innerHTML = `<div class="set"><nav class="snav" aria-label="${esc(T("設定"))}">${vis.map(([k, l, g]) => {
      const head = g !== grp ? `<div class="g">${esc(T(g))}</div>` : ""; grp = g;
      return head + `<a href="#/settings/${k}" class="${k === sec ? "on" : ""}" ${k === sec ? 'aria-current="page"' : ""}>${esc(T(l))}</a>`; }).join("")}</nav>
    <div class="sp" aria-label="${esc(title)}">${body}</div></div>`;
  if (S.afterRender) S.afterRender();
};

initI18n().then(() => { tickClock(); load(); }, () => { tickClock(); load(); });
</script>
</body>
