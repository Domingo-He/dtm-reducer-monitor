[meta]
robot_model = "R-2000iC/165F"
manual = "R-2000iC 机构部维护手册（B-83645EN）"
updated = "2026-10-14"
note = "物料号来自公开数据，下单前请以机台 Parts list 与铭牌确认"

[toolsets.hand]
name = "手工具"
items = [
  { name = "公制六角扳手组（含长柄）", qty = 1, unit = "组" },
  { name = "套筒扳手组（含延长杆、万向接头）", qty = 1, unit = "组" },
  { name = "扭矩扳手：低扭矩段", spec = "范围依手册螺栓扭矩表", qty = 1, unit = "支" },
  { name = "扭矩扳手：高扭矩段", spec = "范围依手册螺栓扭矩表", qty = 1, unit = "支" },
  { name = "顶丝（分离减速机用）", spec = "规格依顶出螺孔", qty = 2, unit = "支" },
  { name = "导杆（与固定螺栓同规格的长螺杆，对位用）", qty = 2, unit = "支" },
  { name = "塑料槌、铜棒", qty = 1, unit = "组" },
  { name = "刮刀、油石（清除旧密封胶与毛边）", qty = 1, unit = "组" },
]

[toolsets.lifting]
name = "吊装与支撑"
items = [
  { name = "行车或移动式吊架", spec = "额定荷重 ≥ 被吊物重量 2 倍（重量依手册）", qty = 1, unit = "台" },
  { name = "M10 吊环螺栓", spec = "手册指定的 J3 臂支撑方式", qty = 2, unit = "个" },
  { name = "吊带", spec = "额定荷重符合吊装计划", qty = 2, unit = "条" },
  { name = "手拉吊车（微调对位）", qty = 1, unit = "台" },
  { name = "支撑架或枕木", qty = 1, unit = "组" },
]

[toolsets.grease]
name = "注脂与采样"
items = [
  { name = "手动黄油枪（附压力表）", spec = "手册要求用手动泵", qty = 1, unit = "支" },
  { name = "注脂嘴转接头", qty = 1, unit = "组" },
  { name = "废脂收集袋或容器", qty = 2, unit = "个" },
  { name = "电子秤（量注入与排出量）", qty = 1, unit = "台" },
  { name = "铁粉采样瓶（旧脂中段、24 小时后残留）", qty = 2, unit = "个" },
]

[toolsets.check]
name = "检查与校正"
items = [
  { name = "示教器", qty = 1, unit = "台" },
  { name = "USB U盘（控制器备份）", qty = 1, unit = "个" },
  { name = "万用表", qty = 1, unit = "台" },
  { name = "手电筒、检查镜", qty = 1, unit = "组" },
  { name = "标记笔、线材标签（拆线前标记）", qty = 1, unit = "组" },
  { name = "零点标定用具", spec = "依厂内采用的校正方式", qty = 1, unit = "组" },
]

[toolsets.ppe]
name = "防护与上锁"
items = [
  { name = "安全帽、安全鞋", qty = 1, unit = "每人" },
  { name = "耐油手套、耐热手套", qty = 1, unit = "每人" },
  { name = "护目镜", qty = 1, unit = "每人" },
  { name = "上锁挂牌组（个人锁、标签）", qty = 1, unit = "每人" },
  { name = "清洁溶剂、无尘布、吸油棉", qty = 1, unit = "批" },
]

