  { name = "Bộ dạy (teach pendant)", qty = 1, unit = "chiếc" },
  { name = "USB (sao lưu bộ điều khiển)", qty = 1, unit = "cái" },
  { name = "Đồng hồ vạn năng", qty = 1, unit = "chiếc" },
  { name = "Đèn pin, gương kiểm tra", qty = 1, unit = "bộ" },
  { name = "Bút đánh dấu, nhãn dây (đánh dấu trước khi tháo dây)", qty = 1, unit = "bộ" },
  { name = "Dụng cụ hiệu chuẩn điểm gốc (mastering)", spec = "Theo phương pháp mastering đang dùng tại nhà máy", qty = 1, unit = "bộ" },
]

[toolsets.ppe]
name = "Bảo hộ và khóa an toàn"
items = [
  { name = "Mũ bảo hộ, giày bảo hộ", qty = 1, unit = "mỗi người" },
  { name = "Găng tay chịu dầu, găng tay chịu nhiệt", qty = 1, unit = "mỗi người" },
  { name = "Kính bảo hộ", qty = 1, unit = "mỗi người" },
  { name = "Bộ khóa và thẻ LOTO (khóa cá nhân, thẻ)", qty = 1, unit = "mỗi người" },
  { name = "Dung môi vệ sinh, khăn không bụi, tấm thấm dầu", qty = 1, unit = "lô" },
]

[[pack]]
id = "R2000iC165F-J3-reducer"
title = "Thay hộp giảm tốc J3"
comp = "reducer"
axes = [3]
crew = 3
hours_min = 10
hours_max = 16
hours_note = "Chỉ là ước tính, không phải giờ chuẩn của FANUC; lần đầu nên bố trí hai ca. Cộng thêm thời gian đông cứng keo nếu cần."
toolsets = ["hand", "lifting", "grease", "check", "ppe"]
roles = [
  { role = "Người phụ trách công việc", n = 1, duty = "Kỹ thuật viên bảo trì robot: khóa và treo thẻ, tháo lắp động cơ, mastering, chạy thử" },
  { role = "Kỹ thuật viên cơ khí", n = 1, duty = "Tháo lắp hộp giảm tốc, làm sạch bề mặt lắp ghép, siết bu lông đúng lực, bơm mỡ" },
  { role = "Người móc cáp", n = 1, duty = "Có chứng chỉ nâng hạ: vận hành và ra hiệu cầu trục, chống đỡ tay J3" },
]
safety = [
  "Họp an toàn đầu ca (toolbox meeting) trước khi làm: xác nhận phân công, kế hoạch nâng và vị trí dừng khẩn cấp",
  "Ngắt điện bộ điều khiển và khóa, treo thẻ; mỗi người vào trong hàng rào phải treo khóa của mình",
  "Trước khi tháo động cơ J3 hoặc nhả phanh J3, phải treo tay J3 bằng 2× bu lông mắt M10 và dây cáp vải ở trạng thái chịu tải; nếu không chống đỡ, tay robot sẽ rơi",
  "Việc nâng do người có chứng chỉ chỉ huy; cấm đứng dưới vật nâng và trên đường di chuyển; kiểm tra tải định mức của dụng cụ nâng",
  "Động cơ và hộp giảm tốc vừa dừng có thể còn nóng: đeo găng chịu nhiệt hoặc chờ nguội",
  "Mỡ có thể phun ra đột ngột khi mở cửa xả: lắp túi hứng trước; chỉ bơm mỡ bằng bơm tay và mỡ được chỉ định",
  "Khi cần cấp điện để chạy jog (xả áp dư, mastering): mọi người ra ngoài hàng rào hoặc giữ công tắc cho phép trên bộ dạy, hệ số tốc độ không quá 10%",
  "Dùng dung môi và keo ở nơi thông gió, đeo găng tay; xử lý mỡ thải và chất thải dính dầu theo quy định nhà máy",
  "Làm việc trên cao phải dùng sàn thao tác đạt chuẩn và đeo dây an toàn theo quy định",
  "Kiểm đếm dụng cụ trước khi hoàn thành, bảo đảm không bỏ quên trong cơ cấu; khóa và thẻ do chính người treo tháo",
]
steps = [
  { name = "Đưa robot về tư thế tháo theo sổ tay, ngắt điện và khóa, họp an toàn đầu ca (đối chiếu phụ tùng và sao lưu bộ điều khiển trước khi dừng máy)", crew = 2, hours = 1.0 },
  { name = "Chống đỡ tay J3 (bu lông mắt + cáp chịu tải); xả mỡ cũ, bỏ phần đầu và lấy phần giữa làm mẫu bột sắt", crew = 3, hours = 1.0 },
  { name = "Đánh dấu và tháo dây động cơ J3, tháo động cơ J3", crew = 2, hours = 0.5 },
  { name = "Tháo bu lông lắp, nâng cụm tay J3 đặt lên giá đỡ, đẩy hộp giảm tốc cũ ra", crew = 3, hours = 2.0 },
  { name = "Làm sạch bề mặt lắp ghép; kiểm tra chốt định vị, lỗ ren và mặt răng bánh răng phía động cơ", crew = 2, hours = 1.0 },
  { name = "Lắp hộp giảm tốc mới: gioăng O, keo làm kín, siết chéo theo từng cấp đến lực quy định", crew = 2, hours = 2.0 },
  { name = "Nâng tay J3 về vị trí, căn chỉnh và siết; lắp lại động cơ J3 và đấu dây; tháo dụng cụ nâng sau khi xác nhận phanh đã giữ (phải tháo xong trước khi cấp điện)", crew = 3, hours = 1.5 },
  { name = "Bơm mỡ (mở cửa xả, bơm đến khi mỡ mới chảy ra) và xả áp dư", crew = 2, hours = 1.0 },
  { name = "Reset pulse coder và mastering J3; xác nhận bằng các điểm của chương trình hiện có", crew = 2, hours = 1.5 },
  { name = "Chạy thử, kiểm tra rò rỉ dầu và tiếng lạ; chạy DTM_DIAG và ghi sự kiện", crew = 2, hours = 1.0 },
]

