# Danh mục phụ tùng và gói công việc (tiếng Việt): tạo tự động từ workpacks.r2000ic_165f.toml bằng tools/workpack_l10n.py.
# Hãy sửa tệp gốc rồi tạo lại. Mã phụ tùng lấy từ tài liệu công khai; xác minh với parts list và nhãn máy trước khi đặt hàng.

[meta]
robot_model = "R-2000iC/165F"
manual = "Sổ tay bảo trì cơ cấu R-2000iC (B-83645EN)"
updated = "2026-10-14"
note = "Mã phụ tùng lấy từ tài liệu công khai; hãy xác minh với parts list và nhãn máy trước khi đặt hàng"

[toolsets.hand]
name = "Dụng cụ cầm tay"
items = [
  { name = "Bộ lục giác hệ mét (gồm loại cán dài)", qty = 1, unit = "bộ" },
  { name = "Bộ khẩu (gồm cần nối dài, khớp lắc léo)", qty = 1, unit = "bộ" },
  { name = "Cờ lê lực, dải lực thấp", spec = "Dải lực theo bảng mô-men siết bu lông trong sổ tay", qty = 1, unit = "cái" },
  { name = "Cờ lê lực, dải lực cao", spec = "Dải lực theo bảng mô-men siết bu lông trong sổ tay", qty = 1, unit = "cái" },
  { name = "Vít đẩy (để tách hộp giảm tốc)", spec = "Kích cỡ theo lỗ ren vít đẩy", qty = 2, unit = "cái" },
  { name = "Thanh dẫn hướng (thanh ren dài cùng cỡ bu lông lắp, để căn chỉnh)", qty = 2, unit = "cái" },
  { name = "Búa nhựa, thanh đồng", qty = 1, unit = "bộ" },
  { name = "Dao cạo, đá mài dầu (làm sạch keo cũ và bavia)", qty = 1, unit = "bộ" },
]

[toolsets.lifting]
name = "Nâng hạ và chống đỡ"
items = [
  { name = "Cầu trục hoặc giá nâng di động", spec = "Tải định mức ≥ 2 lần khối lượng vật nâng (khối lượng theo sổ tay)", qty = 1, unit = "chiếc" },
  { name = "Bu lông mắt M10", spec = "Cách chống đỡ tay J3 theo sổ tay", qty = 2, unit = "cái" },
  { name = "Dây cáp vải", spec = "Tải định mức phù hợp kế hoạch nâng", qty = 2, unit = "sợi" },
  { name = "Pa lăng xích kéo tay (căn chỉnh tinh)", qty = 1, unit = "chiếc" },
  { name = "Giá đỡ hoặc gỗ kê", qty = 1, unit = "bộ" },
]

[toolsets.grease]
name = "Bơm mỡ và lấy mẫu"
items = [
  { name = "Súng bơm mỡ tay (có đồng hồ áp suất)", spec = "Sổ tay yêu cầu dùng bơm tay", qty = 1, unit = "cái" },
  { name = "Đầu nối vú mỡ", qty = 1, unit = "bộ" },
  { name = "Túi hoặc thùng hứng mỡ thải", qty = 2, unit = "cái" },
  { name = "Cân điện tử (cân lượng mỡ bơm vào và xả ra)", qty = 1, unit = "chiếc" },
  { name = "Lọ lấy mẫu bột sắt (phần giữa mỡ cũ, phần còn lại sau 24 giờ)", qty = 2, unit = "cái" },
]

[toolsets.check]
