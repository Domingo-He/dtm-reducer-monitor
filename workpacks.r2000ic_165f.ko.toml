[[pack]]
id = "R2000iC165F-J3-reducer"
title = "J3 감속기 교체"
comp = "reducer"
axes = [3]
crew = 3
hours_min = 10
hours_max = 16
hours_note = "참고 추정치이며 제조사 표준 공수가 아닙니다. 첫 작업은 2개 근무조를 배정할 것을 권장합니다. 실런트 경화 시간이 필요하면 별도로 더하십시오."
toolsets = ["hand", "lifting", "grease", "check", "ppe"]
roles = [
  { role = "작업 책임자", n = 1, duty = "로봇 정비 기술자: 잠금·표지, 모터 탈착, 마스터링, 시운전" },
  { role = "기계 기술자", n = 1, duty = "감속기 탈착, 접합면 청소, 볼트 체결 토크, 급지" },
  { role = "줄걸이 작업자", n = 1, duty = "줄걸이 관련 자격 보유자: 크레인 조작과 신호, J3 암 지지" },
]
safety = [
  "작업 전 TBM(툴박스 미팅) 실시: 역할 분담, 인양 계획, 비상 정지 위치 확인",
  "컨트롤러 전원을 차단하고 잠금·표지 실시. 펜스 안에 들어가는 모든 사람이 자신의 자물쇠를 건다",
  "J3 모터를 분리하거나 J3 브레이크를 해제하기 전에 M10 아이볼트 ×2와 슬링으로 J3 암을 매달아 하중을 받게 할 것. 지지하지 않으면 암이 떨어진다",
  "인양은 자격자가 신호한다. 인양물 아래와 이동 경로에 사람이 서지 않는다. 인양 기구의 정격 하중 확인",
  "정지 직후의 모터와 감속기는 고온일 수 있음: 내열 장갑을 착용하거나 식을 때까지 기다린다",
  "배지구를 열 때 그리스가 갑자기 분출될 수 있음: 먼저 회수 봉투를 씌운다. 급지는 수동 펌프와 지정 그리스만 사용",
  "통전하여 조그 운전이 필요할 때(잔압 해제, 마스터링): 인원은 펜스 밖으로 나가거나 티치 펜던트 인에이블 스위치를 잡고, 오버라이드 10% 이하",
  "용제와 실런트는 환기가 되는 곳에서 장갑을 끼고 사용. 폐그리스와 기름 묻은 폐기물은 사내 규정에 따라 처리",
  "고소 작업 시 적합한 작업대를 사용하고 규정에 따라 안전대를 착용",
  "완료 전 공구 수량을 확인하여 기구 안에 남은 것이 없는지 확인. 잠금·표지는 건 본인이 해제",
]
steps = [
  { name = "매뉴얼에 지정된 분해 자세로 이동, 전원 차단 및 잠금, TBM (예비품 대조와 컨트롤러 백업은 정지 전에 완료)", crew = 2, hours = 1.0 },
  { name = "J3 암 지지 (아이볼트 + 슬링으로 하중 지지). 폐그리스를 배출하고 앞부분은 버린 뒤 중간부를 철분 시료로 채취", crew = 3, hours = 1.0 },
  { name = "J3 모터 케이블에 표시 후 분리하고 J3 모터를 분리", crew = 2, hours = 0.5 },
  { name = "고정 볼트를 풀고 J3 암 조립체를 들어 지지대에 올린 뒤 기존 감속기를 밀어낸다", crew = 3, hours = 2.0 },
  { name = "접합면 청소. 위치결정 핀, 나사 구멍, 모터 측 기어 치면 점검", crew = 2, hours = 1.0 },
  { name = "새 감속기 장착: O링, 실런트, 대각선 순서로 단계적으로 규정 토크까지 체결", crew = 2, hours = 2.0 },
  { name = "J3 암을 다시 들어 위치를 맞추고 체결. J3 모터를 장착하고 결선. 브레이크가 유지하는 것을 확인한 후 인양 기구 제거 (통전 전에 반드시 제거)", crew = 3, hours = 1.5 },
  { name = "급지 (배지구를 열고 새 그리스가 나올 때까지 주입) 후 잔압 해제", crew = 2, hours = 1.0 },
  { name = "펄스 코더 리셋과 J3 마스터링. 기존 프로그램 포인트로 확인", crew = 2, hours = 1.5 },
  { name = "시운전, 누유 및 이상음 점검. DTM_DIAG 실행 후 이벤트 등록", crew = 2, hours = 1.0 },
]

