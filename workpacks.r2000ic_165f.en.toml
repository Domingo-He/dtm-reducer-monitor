[[pack]]
id = "R2000iC165F-J3-reducer"
title = "J3 reducer replacement"
comp = "reducer"
axes = [3]
crew = 3
hours_min = 10
hours_max = 16
hours_note = "Estimate only, not FANUC standard hours; plan two shifts for the first job. Add sealant curing time if required."
toolsets = ["hand", "lifting", "grease", "check", "ppe"]
roles = [
  { role = "Job lead", n = 1, duty = "Robot service technician: lockout/tagout, motor removal and installation, mastering, test run" },
  { role = "Mechanical technician", n = 1, duty = "Reducer removal and installation, mating surface cleaning, bolt torque, greasing" },
  { role = "Rigger", n = 1, duty = "Certified for rigging: crane operation and signaling, J3 arm support" },
]
safety = [
  "Hold a toolbox meeting before starting: confirm roles, the lifting plan and emergency stop locations",
  "Power off the controller and apply lockout/tagout; everyone entering the fence applies their own lock",
  "Before removing the J3 motor or releasing the J3 brake, support the J3 arm with 2× M10 eyebolts and slings under load; an unsupported arm will fall",
  "Lifting is directed by a certified person; nobody under the load or in its path; check the rated load of the lifting gear",
  "Motors and reducers may be hot right after stopping: wear heat-resistant gloves or let them cool",
  "Grease may spurt out when the outlet is opened: fit a collection bag first; grease only with a manual pump and the specified grease",
  "When power is needed for jogging (pressure release, mastering): everyone leaves the fence or holds the teach pendant enabling switch, override 10% or less",
  "Use solvents and sealants in a ventilated area with gloves; dispose of waste grease and oily waste per site rules",
  "For work at height use an approved platform and wear a harness as required",
  "Count tools before finishing and make sure none are left in the mechanism; each lock and tag is removed by the person who applied it",
]
steps = [
  { name = "Move to the removal posture specified in the manual, power off and lock out, toolbox meeting (check spare parts and back up the controller before the stop)", crew = 2, hours = 1.0 },
  { name = "Support the J3 arm (eyebolts + slings under load); drain the old grease, discard the first portion and take the middle portion as the iron debris sample", crew = 3, hours = 1.0 },
  { name = "Mark and disconnect the J3 motor cables, remove the J3 motor", crew = 2, hours = 0.5 },
  { name = "Remove the mounting bolts, lift the J3 arm assembly onto the support stand, jack out the old reducer", crew = 3, hours = 2.0 },
  { name = "Clean the mating surfaces; inspect dowel pins, tapped holes and the motor-side gear teeth", crew = 2, hours = 1.0 },
  { name = "Install the new reducer: O-rings, sealant, tighten in a cross pattern in stages to the specified torque", crew = 2, hours = 2.0 },
  { name = "Lift the J3 arm back, align and bolt; refit and reconnect the J3 motor; remove the rigging once the brake holds (must be removed before power-on)", crew = 3, hours = 1.5 },
  { name = "Grease (outlet open, inject until new grease comes out) and release residual pressure", crew = 2, hours = 1.0 },
  { name = "Pulse coder reset and J3 mastering; confirm with existing program points", crew = 2, hours = 1.5 },
  { name = "Test run, check for leaks and abnormal noise; run DTM_DIAG and record the event", crew = 2, hours = 1.0 },
]

